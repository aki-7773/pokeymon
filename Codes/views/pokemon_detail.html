    async function loadEvolutionTree(baseId, specialInfo = null) {
        const evolutionContainer = document.getElementById('evolutionTree');
        if (!evolutionContainer) return;
        evolutionContainer.innerHTML = '<div class="loader-small"></div><p style="text-align:center;">Loading evolution chain...</p>';

        try {
            const speciesResponse = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${baseId}`);
            if (!speciesResponse.ok) throw new Error('Species not found');
            const species = await speciesResponse.json();
            const chainResponse = await fetch(species.evolution_chain.url);
            const chainData = await chainResponse.json();

            let evolutionNames = [];
            let current = chainData.chain;
            function collectEvolutions(chain, list) {
                list.push(chain.species.name);
                if (chain.evolves_to && chain.evolves_to.length > 0) {
                    for (let evo of chain.evolves_to) collectEvolutions(evo, list);
                }
            }
            collectEvolutions(current, evolutionNames);
            evolutionNames = [...new Set(evolutionNames)];

            const evolutionDetails = [];
            for (const name of evolutionNames) {
                try {
                    const pokeRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${name}`);
                    const pokeData = await pokeRes.json();
                    evolutionDetails.push({ id: pokeData.id, name: name.charAt(0).toUpperCase() + name.slice(1) });
                } catch(e) {}
            }

            let html = '<div class="evolution-title">🌳 Evolution Tree</div><div class="evolution-chain">';
            for (let i = 0; i < evolutionDetails.length; i++) {
                const evo = evolutionDetails[i];
                html += `<div class="evolution-node"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${evo.id}.png" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${evo.id}.png'"><a href="pokemon_detail.html?id=${evo.id}">${evo.name}</a></div>`;
                if (i < evolutionDetails.length - 1) html += '<div class="evolution-arrow">→</div>';
            }
            // Falls es sich um eine spezielle Form handelt, hänge diese am Ende an
            if (specialInfo && currentPokemonId > 10000) {
                html += `<div class="evolution-arrow">→</div>`;
                html += `<div class="evolution-node"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${currentPokemonId}.png" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'"><div><strong>${specialInfo.displayName}</strong></div><div class="special-badge">Special Form</div></div>`;
            }
            html += '</div>';
            if (evolutionDetails.length === 0) html = '<p>No evolution data available for this Pokémon.</p>';
            if (evolutionDetails.length === 0 && !specialInfo) html = '<p>No evolution data available for this Pokémon.</p>';
            evolutionContainer.innerHTML = html;
        } catch(error) {
            evolutionContainer.innerHTML = '<p>⚠️ Evolution data could not be loaded.</p>';
        }
    }

    async function loadPokedexEntry(speciesId, customName = null) {
        try {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${speciesId}`);
            if (!response.ok) return "No Pokédex entry available.";
            const data = await response.json();
            for (const entry of data.flavor_text_entries) {
                if (entry.language.name === "en") {
                    let text = entry.flavor_text.replace(/\n/g, ' ').replace(/\f/g, ' ');
                    if (customName) {
                        const originalName = data.name.charAt(0).toUpperCase() + data.name.slice(1);
                        text = text.replace(originalName, customName);
                    }
                    return text;
                }
            }
            return "No English Pokédex entry found.";
        } catch(e) { return "Unable to load Pokédex entry."; }
    }
