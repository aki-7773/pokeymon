<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pokémon Detail - Complete Information</title>
    <style>
        /* ========== GLOBALE STYLES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
            position: relative;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        body::before {
            content: "";

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255,255,255,0.06) 2px, transparent 2px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .nav-prev, .nav-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(42,117,187,0.9);
            color: white;
            width: 55px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            border-radius: 30px;
            transition: all 0.3s;
            z-index: 100;
            border: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }
        
        .nav-prev {
            left: 20px;
        }
        
        .nav-next {
            right: 20px;
        }
        
        .nav-prev:hover, .nav-next:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: translateY(-50%) scale(1.05);
            width: 60px;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        
        .dark-mode-toggle:hover, .language-select:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: scale(1.03);
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
            margin-bottom: 8px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-id {
            font-size: 16px;
            color: #777;
            font-weight: 500;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
            transition: transform 0.3s;
        }
        
        .pokemon-image:hover {
            transform: scale(1.03);
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .cry-button, .print-btn {
            background: #2a75bb;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 15px;
        }
        
        .cry-button:hover, .print-btn:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: scale(1.03);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;
            border-radius: 24px;
        }
        
        body.dark-mode .info-grid {
            background: rgba(255,255,255,0.05);
        }
        
        .info-card {
            background: white;
            padding: 14px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokémon Detail</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    background: rgba(0,0,0,0.4);
    padding: 20px;
    border-radius: 20px;
}

img {
    width: 200px;
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 15px;
    margin: 3px;
    color: white;
    font-size: 12px;
}

.section {
    margin-top: 20px;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
}

.stat {
    margin: 5px 0;
}

.back {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 15px;
    background: #ffcb05;
    color: black;
    text-decoration: none;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container" id="content">
    Loading...
</div>

<script>
const typeColors = {
    normal: "#A8A878", fire: "#F08030", water: "#6890F0",
    electric: "#F8D030", grass: "#78C850", ice: "#98D8D8",
    fighting: "#C03028", poison: "#A040A0", ground: "#E0C068",
    flying: "#A890F0", psychic: "#F85888", bug: "#A8B820",
    rock: "#B8A038", ghost: "#705898", dragon: "#7038F8",
    dark: "#705848", steel: "#B8B8D0", fairy: "#EE99AC"
};

function getIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return params.get("id");
}

async function loadPokemon() {
    const id = getIdFromUrl();

    // 1️⃣ POKÉMON (FORM / SPRITE / STATS)
    const pRes = await fetch(`/api/pokemon/${id}`);
    const pokemon = await pRes.json();

    // 2️⃣ SPECIES (POKÉDEX TEXT / EVOLUTION)
    const sRes = await fetch(`/api/pokemon-species/${pokemon.species.name}`);
    const species = await sRes.json();

    const name = pokemon.name.toUpperCase();

    // IMAGE FIX (important for forms)
    const image =
        pokemon.sprites.other?.["official-artwork"]?.front_default ||
        pokemon.sprites.front_default;

    // Pokédex Entry (English fix)
    let entry = "No entry found";

    if (species.flavor_text_entries) {
        const enEntry = species.flavor_text_entries.find(
            e => e.language.name === "en"
        );
        if (enEntry) entry = enEntry.flavor_text.replace(/\f/g, " ");
    }

    // TYPES
    const types = pokemon.types.map(t =>
        `<span class="badge" style="background:${typeColors[t.type.name]}">
        ${t.type.name.toUpperCase()}
        </span>`
    ).join("");

    // STATS
    const stats = pokemon.stats.map(s =>
        `<div class="stat">${s.stat.name.toUpperCase()}: ${s.base_stat}</div>`
    ).join("");

    document.getElementById("content").innerHTML = `
        <h1>${name}</h1>
        <h3>#${pokemon.id}</h3>

        <img src="${image}">

        <div class="section">
            <h3>Types</h3>
            ${types}
        </div>

        <div class="section">
            <h3>Stats</h3>
            ${stats}
        </div>

        <div class="section">
            <h3>Pokédex Entry</h3>
            <p>${entry}</p>
        </div>

        <a class="back" href="pokemon_list.html">← Back</a>
    `;
}

loadPokemon();
</script>

</body>
</html>
