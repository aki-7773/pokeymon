<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokémon detail</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
}

body.dark{
    background:#1a1a2e;
}

.topbar{
    position:fixed;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:1000;
}

.container{
    max-width:900px;
    margin:auto;
    margin-top:70px;
    background:rgba(0,0,0,0.4);
    padding:25px;
    border-radius:20px;
}

img{ width:220px; }

.title{
    font-size:32px;
    font-weight:bold;
}

.sub{
    opacity:0.8;
    margin-bottom:10px;
}

/* NAV */
.navRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:15px 0;
}

.navBtn{
    font-size:34px;
    padding:10px 20px;
}

/* CENTER */
.centerCol{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

/* SECTIONS */
.section{
    margin-top:15px;
    padding:12px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
}

/* TABLE STYLE */
.table{
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
}

/* BADGE */
.badge{
    padding:6px 10px;
    border-radius:20px;
    margin:3px;
    display:inline-block;
    font-size:12px;
    background:rgba(255,255,255,0.2);
}

/* EVO */
.evoBox{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.evoItem{
    cursor:pointer;
    text-align:center;
}

.evoItem img{
    width:100px;
    transition:0.2s;
}

.evoItem:hover img{
    transform:scale(1.1);
}

button,a,select{
    padding:10px 12px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background:#ffcb05;
    color:black;
    text-decoration:none;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <select onchange="setLang(this.value)">
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="ja">JP</option>
    </select>

    <button onclick="toggleDark()">🌙</button>
    <button onclick="window.print()">🖨</button>
</div>

<div id="content">Loading...</div>

<script>

const id = Number(new URLSearchParams(location.search).get("id")) || 1;

if(id > 721){
    document.getElementById("content").innerHTML =
        "<h2>Only Gen 1–6 supported</h2>";
    throw new Error("Gen limit");
}

let lang = localStorage.getItem("lang") || "en";

function setLang(l){
    lang = l;
    localStorage.setItem("lang", l);
    load();
}

if(localStorage.getItem("dark")==="true")
    document.body.classList.add("dark");

function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
}

function nav(x){
    let newId = id + x;
    if(newId < 1) newId = 721;
    if(newId > 721) newId = 1;
    location.href = `?id=${newId}`;
}

function playCry(url){
    if(url) new Audio(url).play();
}

function fix(t){
    return t ? t.replace(/\f/g," ").replace(/\n/g," ") : "No entry";
}

function region(id){
    if(id<=151) return "Kanto";
    if(id<=251) return "Johto";
    if(id<=386) return "Hoenn";
    if(id<=493) return "Sinnoh";
    if(id<=649) return "Unova";
    return "Kalos";
}

/* EVOLUTION FIX (FULL TREE + REAL CHECK) */
async function loadEvolution(species){
    const s = await fetch(`/api/pokemon-species/${species}`).then(r=>r.json());
    const evo = await fetch(s.evolution_chain.url).then(r=>r.json());

    let list = [];

    function walk(node){
        list.push(node.species.name);
        node.evolves_to.forEach(walk);
    }

    walk(evo.chain);

    if(list.length <= 1){
        const p = await fetch(`/api/pokemon/${species}`).then(r=>r.json());

        document.getElementById("evo").innerHTML = `
            <div class="section">
                <h3>Evolution Tree</h3>
                <img src="${p.sprites.front_default}">
                <p>This Pokémon does not evolve.</p>
            </div>
        `;
        return;
    }

    const html = await Promise.all(list.map(async name=>{
        const p = await fetch(`/api/pokemon/${name}`).then(r=>r.json());

        return `
        <div class="evoItem" onclick="location.href='?id=${p.id}'">
            <img src="${p.sprites.front_default}">
            <div>${name}</div>
        </div>`;
    }));

    document.getElementById("evo").innerHTML = `
        <div class="section">
            <h3>Evolution Tree</h3>
            <div class="evoBox">${html.join("")}</div>
        </div>
    `;
}

async function load(){
    const p = await fetch(`/api/pokemon/${id}`).then(r=>r.json());
    const s = await fetch(`/api/pokemon-species/${p.species.name}`).then(r=>r.json());

    const entryObj =
        s.flavor_text_entries.find(e=>e.language.name===lang)
        || s.flavor_text_entries.find(e=>e.language.name==="en");

    const entry = fix(entryObj?.flavor_text);

    const types = p.types.map(t=>
        `<span class="badge">${t.type.name.toUpperCase()}</span>`
    ).join("");

    const abilities = p.abilities.map(a=>
        `<div class="row"><b>Ability</b><span>${a.ability.name.toUpperCase()}</span></div>`
    ).join("");

    const stats = p.stats.map(x=>
        `<div class="row"><b>${x.stat.name.toUpperCase()}</b><span>${x.base_stat}</span></div>`
    ).join("");

    const cry = p.cries?.latest || p.cries?.legacy;

    document.getElementById("content").innerHTML = `
    <div class="container">

        <div class="title">${p.name.toUpperCase()}</div>
        <div class="sub">#${p.id}</div>

        <div class="navRow">
            <button class="navBtn" onclick="nav(-1)">⬅</button>

            <div class="centerCol">
                <img src="${p.sprites.other?.["official-artwork"]?.front_default || p.sprites.front_default}">
                <button onclick="playCry('${cry}')">🔊 Cry</button>
            </div>

            <button class="navBtn" onclick="nav(1)">➡</button>
        </div>

        <div class="section">
            <h3>Types</h3>
            ${types}
        </div>

        <div class="section">
            <h3>Abilities</h3>
            ${abilities}
        </div>

        <div class="section">
            <h3>Stats</h3>
            <div class="table">${stats}</div>
        </div>

        <div class="section">
            <h3>Pokédex Entry</h3>
            <p>${entry}</p>
        </div>

        <div class="section">
            <h3>Region</h3>
            <button onclick="location.href='/region.html?name=${region(p.id)}'">
                ${region(p.id)}
            </button>
        </div>

        <div id="evo">Loading...</div>

    </div>
    `;

    loadEvolution(p.species.name);
}

load();

</script>

</body>
</html>
