<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokémon detail</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
}

body.dark{
    background:#1a1a2e;
}

.topbar{
    position:fixed;
    top:10px;
    left:10px;
    display:flex;
    gap:8px;
    z-index:1000;
}

.container{
    max-width:900px;
    margin:auto;
    margin-top:70px;
    background:rgba(0,0,0,0.4);
    padding:20px;
    border-radius:20px;
}

img{
    width:220px;
}

.navRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
}

.centerCol{
    display:flex;
    flex-direction:column;
    align-items:center;
}

.section{
    margin-top:15px;
    padding:10px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    margin:3px;
    display:inline-block;
    font-size:12px;
}

button,a,select{
    padding:10px 12px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background:#ffcb05;
    color:black;
    text-decoration:none;
}

.evoBox{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.evoItem{
    cursor:pointer;
    text-align:center;
}

.evoItem img{
    width:100px;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <select onchange="setLang(this.value)">
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="ja">JP</option>
    </select>

    <button onclick="toggleDark()">🌙</button>
    <button onclick="window.print()">🖨</button>
</div>

<div id="content">Loading...</div>

<script>

const id = Number(new URLSearchParams(location.search).get("id")) || 1;

// GEN LIMIT
if(id > 721){
    document.getElementById("content").innerHTML =
        "<h2>❌ Only Gen 1–6 supported</h2>";
    throw new Error("Gen limit");
}

const typeColors = {
 normal:"#A8A878", fire:"#F08030", water:"#6890F0",
 electric:"#F8D030", grass:"#78C850", ice:"#98D8D8",
 fighting:"#C03028", poison:"#A040A0", ground:"#E0C068",
 flying:"#A890F0", psychic:"#F85888", bug:"#A8B820",
 rock:"#B8A038", ghost:"#705898", dragon:"#7038F8",
 dark:"#705848", steel:"#B8B8D0", fairy:"#EE99AC"
};

// 🌍 LANGUAGE
let lang = localStorage.getItem("lang") || "en";
function setLang(l){
    lang = l;
    localStorage.setItem("lang", l);
    load();
}

// 🌙 DARK MODE
if(localStorage.getItem("dark")==="true")
    document.body.classList.add("dark");

function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
}

// ◀ ▶ NAV
function nav(x){
    let newId = id + x;
    if(newId < 1) newId = 721;
    if(newId > 721) newId = 1;
    location.href = `?id=${newId}`;
}

// 🔊 CRY
function playCry(url){
    if(url) new Audio(url).play();
}

// TEXT FIX
function fix(t){
    return t ? t.replace(/\f/g," ").replace(/\n/g," ") : "No entry";
}

// REGION
function region(id){
    if(id<=151) return "Kanto";
    if(id<=251) return "Johto";
    if(id<=386) return "Hoenn";
    if(id<=493) return "Sinnoh";
    if(id<=649) return "Unova";
    return "Kalos";
}

// 🌳 EVOLUTION (CLICKABLE)
async function loadEvolution(species){
    try{
        const s = await fetch(`/api/pokemon-species/${species}`).then(r=>r.json());
        const chain = await fetch(s.evolution_chain.url).then(r=>r.json());

        let list = [];

        function walk(c){
            list.push(c.species.name);
            c.evolves_to.forEach(walk);
        }

        walk(chain.chain);

        const html = await Promise.all(list.map(async name=>{
            const p = await fetch(`/api/pokemon/${name}`).then(r=>r.json());

            return `
            <div class="evoItem" onclick="location.href='?id=${p.id}'">
                <img src="${p.sprites.front_default}">
                <div>${name}</div>
            </div>`;
        }));

        document.getElementById("evo").innerHTML =
            `<div class="evoBox">${html.join("")}</div>`;

    } catch(e){
        document.getElementById("evo").innerHTML = "";
    }
}

// MAIN
async function load(){
    try{

        const p = await fetch(`/api/pokemon/${id}`).then(r=>r.json());
        const s = await fetch(`/api/pokemon-species/${p.species.name}`).then(r=>r.json());

        const entryObj = s.flavor_text_entries.find(e=>e.language.name===lang)
            || s.flavor_text_entries.find(e=>e.language.name==="en");

        const entry = fix(entryObj?.flavor_text);

        const types = p.types.map(t=>
            `<span class="badge" style="background:${typeColors[t.type.name]}">
                ${t.type.name.toUpperCase()}
            </span>`
        ).join("");

        const abilities = p.abilities.map(a=>
            `<div>${a.ability.name.toUpperCase()}</div>`
        ).join("");

        const stats = p.stats.map(x=>
            `<div>${x.stat.name.toUpperCase()}: ${x.base_stat}</div>`
        ).join("");

        const cry = p.cries?.latest || p.cries?.legacy;

        document.getElementById("content").innerHTML = `
        <div class="container">

            <h1>${p.name.toUpperCase()}</h1>
            <h3>#${p.id} | ${region(p.id)}</h3>

            <div class="navRow">
                <button onclick="nav(-1)">⬅</button>

                <div class="centerCol">
                    <img src="${p.sprites.other?.["official-artwork"]?.front_default || p.sprites.front_default}">
                    <button onclick="playCry('${cry}')">🔊 Cry</button>
                </div>

                <button onclick="nav(1)">➡</button>
            </div>

            <div class="section">
                <h3>Types</h3>
                ${types}
            </div>

            <div class="section">
                <h3>Abilities</h3>
                ${abilities}
            </div>

            <div class="section">
                <h3>Stats</h3>
                ${stats}
            </div>

            <div class="section">
                <h3>Pokédex Entry</h3>
                <p>${entry}</p>
            </div>

            <div class="section">
                <h3>🌳 Evolution</h3>
                <div id="evo">Loading...</div>
            </div>

        </div>
        `;

        loadEvolution(p.species.name);

    } catch(e){
        console.error(e);
        document.getElementById("content").innerHTML =
            "<h2>❌ Error loading Pokémon</h2>";
    }
}

load();

</script>

</body>
</html>
