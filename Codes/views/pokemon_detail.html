<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokémon detail</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
}

body.dark{
    background:#1a1a2e;
}

/* TOPBAR */
.topbar{
    position:fixed;
    top:10px;
    left:10px;
    display:flex;
    gap:8px;
    z-index:1000;
}

.topbar button, .topbar select{
    font-weight:bold;
}

/* MAIN CONTAINER */
.container{
    max-width:900px;
    margin:auto;
    margin-top:70px;
    background:rgba(0,0,0,0.4);
    padding:20px;
    border-radius:20px;
}

/* NAV */
.navRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0;
}

.navBtn{
    font-size:28px;
    padding:10px 18px;
    font-weight:bold;
}

/* CENTER IMAGE */
.centerCol{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* IMAGE */
img{
    width:220px;
}

/* SHINY BIG FIX */
.shinyImg{
    width:220px;
}

/* BADGES */
.badge{
    padding:6px 10px;
    border-radius:20px;
    margin:3px;
    display:inline-block;
    font-size:12px;
    font-weight:bold;
    color:white;
}

/* SECTION */
.section{
    margin-top:15px;
    padding:12px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
}

/* CARDS (abilities/stats) */
.cardGrid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

.card{
    background:rgba(255,255,255,0.12);
    padding:8px 12px;
    border-radius:12px;
    font-weight:bold;
    min-width:120px;
}

/* BUTTONS */
button,a,select{
    padding:10px 12px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background:#ffcb05;
    color:black;
    text-decoration:none;
    font-weight:bold;
}

/* EVO */
.evoBox{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.evoItem{
    cursor:pointer;
    text-align:center;
    padding:8px;
    border-radius:12px;
    background:rgba(255,255,255,0.1);
}

.evoItem img{
    width:110px;
}

.smallLinks{
    margin-top:10px;
    display:flex;
    justify-content:center;
    gap:10px;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <select onchange="setLang(this.value)">
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="ja">JP</option>
    </select>

    <button onclick="toggleDark()">🌙</button>
</div>

<div id="content">Loading...</div>

<script>

const id = Number(new URLSearchParams(location.search).get("id")) || 1;

/* LIMIT (Gen 1–6) */
if(id > 721){
    document.getElementById("content").innerHTML =
        "<h2>Only Gen 1–6 supported</h2>";
    throw new Error("Gen limit");
}

const typeColors = {
 normal:"#A8A878", fire:"#F08030", water:"#6890F0",
 electric:"#F8D030", grass:"#78C850", ice:"#98D8D8",
 fighting:"#C03028", poison:"#A040A0", ground:"#E0C068",
 flying:"#A890F0", psychic:"#F85888", bug:"#A8B820",
 rock:"#B8A038", ghost:"#705898", dragon:"#7038F8",
 dark:"#705848", steel:"#B8B8D0", fairy:"#EE99AC"
};

/* LANG */
let lang = localStorage.getItem("lang") || "en";

function setLang(l){
    lang = l;
    localStorage.setItem("lang", l);
    load();
}

/* DARK */
if(localStorage.getItem("dark")==="true")
    document.body.classList.add("dark");

function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
}

/* NAV */
function nav(x){
    let newId = id + x;
    if(newId < 1) newId = 721;
    if(newId > 721) newId = 1;
    location.href = `?id=${newId}`;
}

/* CRY */
function playCry(url){
    if(url) new Audio(url).play();
}

/* FIX TEXT */
function fix(t){
    return t ? t.replace(/\f/g," ").replace(/\n/g," ") : "No entry";
}

/* REGION LINK FIX */
function openRegion(){
    location.href = "regions_detail.html?id=" + id;
}

/* SHINY TOGGLE */
let isShiny = false;

function toggleShiny(p){
    isShiny = !isShiny;
    const img = document.getElementById("pokeImg");

    img.src = isShiny
        ? p.sprites.front_shiny
        : (p.sprites.other?.["official-artwork"]?.front_default || p.sprites.front_default);
}

/* EVOLUTION FIX (ROBUST) */
async function loadEvolution(species){
    try{
        const s = await fetch(`/api/pokemon-species/${species}`).then(r=>r.json());
        const chain = await fetch(s.evolution_chain.url).then(r=>r.json());

        let list = [];

        function walk(c){
            if(!c) return;
            list.push(c.species.name);
            c.evolves_to.forEach(walk);
        }

        walk(chain.chain);

        const html = await Promise.all(list.map(async name=>{
            const p = await fetch(`/api/pokemon/${name}`).then(r=>r.json());

            return `
            <div class="evoItem" onclick="location.href='?id=${p.id}'">
                <img src="${p.sprites.front_default}">
                <div>${name}</div>
            </div>`;
        }));

        document.getElementById("evo").innerHTML =
            `<div class="evoBox">${html.join("")}</div>`;

    } catch(e){
        document.getElementById("evo").innerHTML =
            "<p>Evolution data not available</p>";
    }
}

/* MAIN */
async function load(){
    try{

        const p = await fetch(`/api/pokemon/${id}`).then(r=>r.json());
        const s = await fetch(`/api/pokemon-species/${p.species.name}`).then(r=>r.json());

        const entryObj = s.flavor_text_entries.find(e=>e.language.name===lang)
            || s.flavor_text_entries.find(e=>e.language.name==="en");

        const entry = fix(entryObj?.flavor_text);

        const types = p.types.map(t=>
            `<span class="badge" style="background:${typeColors[t.type.name]}">
                ${t.type.name.toUpperCase()}
            </span>`
        ).join("");

        const abilities = p.abilities.map(a=>
            `<div class="card">${a.ability.name.toUpperCase()}</div>`
        ).join("");

        const stats = p.stats.map(x=>
            `<div class="card">${x.stat.name.toUpperCase()}: ${x.base_stat}</div>`
        ).join("");

        const cry = p.cries?.latest || p.cries?.legacy;

        const image =
            p.sprites.other?.["official-artwork"]?.front_default ||
            p.sprites.front_default;

        document.getElementById("content").innerHTML = `
        <div class="container">

            <h1>${p.name.toUpperCase()}</h1>
            <h3>#${p.id}</h3>

            <div class="navRow">
                <button class="navBtn" onclick="nav(-1)">⬅</button>

                <div class="centerCol">
                    <img id="pokeImg" src="${image}">
                    <button onclick="playCry('${cry}')"><b>🔊 Cry</b></button>
                    <button onclick="toggleShiny(${JSON.stringify(p).replace(/"/g,'&quot;')})"><b>✨ Shiny</b></button>
                </div>

                <button class="navBtn" onclick="nav(1)">➡</button>
            </div>

            <div class="section">
                <h3>Types</h3>
                ${types}
            </div>

            <div class="section">
                <h3>Abilities</h3>
                <div class="cardGrid">${abilities}</div>
            </div>

            <div class="section">
                <h3>Stats</h3>
                <div class="cardGrid">${stats}</div>
            </div>

            <div class="section">
                <h3>Pokédex Entry</h3>
                <p>${entry}</p>
            </div>

            <div class="section">
                <h3>Region</h3>
                <button onclick="openRegion()"><b>View Region</b></button>
            </div>

            <div class="section">
                <h3>🌳 Evolution Tree</h3>
                <div id="evo">Loading...</div>
            </div>

            <div class="smallLinks">
                <a href="pokemon_list.html"><b>Back to List</b></a>
                <a href="start.html"><b>Home</b></a>
            </div>

        </div>`;

        loadEvolution(p.species.name);

    } catch(e){
        console.error(e);
        document.getElementById("content").innerHTML =
            "<h2>Error loading Pokémon</h2>";
    }
}

load();

</script>

</body>
</html>
