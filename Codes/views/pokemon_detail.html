<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pokémon detail</title>

<style>
body{
    margin:0;
    font-family: Arial;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
}

body.dark{
    background:#1a1a2e;
}

.topbar{
    position:fixed;
    top:10px;
    right:10px;
    display:flex;
    gap:8px;
    z-index:1000;
}

.container{
    max-width:900px;
    margin:auto;
    margin-top:70px;
    background:rgba(0,0,0,0.4);
    padding:25px;
    border-radius:20px;
}

img{ width:220px; }

.headerRow{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
}

.printBtn{
    display:flex;
    align-items:center;
    gap:6px;
}

.navRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:15px 0;
}

.navBtn{
    font-size:34px;
    padding:10px 20px;
}

.centerCol{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

.section{
    margin-top:15px;
    padding:12px;
    background:rgba(255,255,255,0.08);
    border-radius:12px;
}

/* TYPES */
.typeBadge{
    padding:6px 10px;
    border-radius:20px;
    margin:3px;
    display:inline-block;
    font-size:12px;
    color:white;
}

/* STAT + ABILITY ROWS */
.row{
    display:flex;
    justify-content:space-between;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.12);
    margin:5px 0;
}

/* REGION */
.regionBtn{
    padding:10px 14px;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    cursor:pointer;
}

/* EVO */
.evoBox{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.evoItem{
    cursor:pointer;
    text-align:center;
}

.evoItem img{
    width:100px;
}

.footer{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

button,a,select{
    padding:10px 12px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    background:#ffcb05;
    color:black;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="topbar">
    <select onchange="setLang(this.value)">
        <option value="en">EN</option>
        <option value="de">DE</option>
        <option value="fr">FR</option>
        <option value="ja">JP</option>
    </select>
    <button onclick="toggleDark()">🌙</button>
</div>

<div id="content">Loading...</div>

<script>

const id = Number(new URLSearchParams(location.search).get("id")) || 1;

if(id > 721){
    document.getElementById("content").innerHTML =
        "<h2>Only Gen 1–6 supported</h2>";
    throw new Error();
}

/* TYPE COLORS FIX */
const typeColors = {
 normal:"#A8A878", fire:"#F08030", water:"#6890F0",
 electric:"#F8D030", grass:"#78C850", ice:"#98D8D8",
 fighting:"#C03028", poison:"#A040A0", ground:"#E0C068",
 flying:"#A890F0", psychic:"#F85888", bug:"#A8B820",
 rock:"#B8A038", ghost:"#705898", dragon:"#7038F8",
 dark:"#705848", steel:"#B8B8D0", fairy:"#EE99AC"
};

let lang = localStorage.getItem("lang") || "en";
function setLang(l){
    lang = l;
    localStorage.setItem("lang", l);
    load();
}

if(localStorage.getItem("dark")==="true")
    document.body.classList.add("dark");

function toggleDark(){
    document.body.classList.toggle("dark");
    localStorage.setItem("dark", document.body.classList.contains("dark"));
}

function nav(x){
    let newId = id + x;
    if(newId < 1) newId = 721;
    if(newId > 721) newId = 1;
    location.href = `?id=${newId}`;
}

function playCry(url){
    if(url) new Audio(url).play();
}

function fix(t){
    return t ? t.replace(/\f/g," ").replace(/\n/g," ") : "No entry";
}

function region(id){
    if(id<=151) return "Kanto";
    if(id<=251) return "Johto";
    if(id<=386) return "Hoenn";
    if(id<=493) return "Sinnoh";
    if(id<=649) return "Unova";
    return "Kalos";
}

/* EVOLUTION FIXED (NO STUCK LOADING) */
async function loadEvolution(species){
    try{
        const s = await fetch(`/api/pokemon-species/${species}`).then(r=>r.json());
        const evo = await fetch(s.evolution_chain.url).then(r=>r.json());

        let list = [];

        function walk(node){
            list.push(node.species.name);
            node.evolves_to.forEach(walk);
        }

        walk(evo.chain);

        if(list.length <= 1){
            const p = await fetch(`/api/pokemon/${species}`).then(r=>r.json());
            document.getElementById("evo").innerHTML = `
                <div class="section">
                    <h3>Evolution Tree</h3>
                    <img src="${p.sprites.front_default}">
                    <p>This Pokémon does not evolve.</p>
                </div>
            `;
            return;
        }

        const html = await Promise.all(list.map(async name=>{
            const p = await fetch(`/api/pokemon/${name}`).then(r=>r.json());

            return `
            <div class="evoItem" onclick="location.href='?id=${p.id}'">
                <img src="${p.sprites.front_default}">
                <div>${name}</div>
            </div>`;
        }));

        document.getElementById("evo").innerHTML = `
            <div class="section">
                <h3>Evolution Tree</h3>
                <div class="evoBox">${html.join("")}</div>
            </div>
        `;

    } catch(e){
        document.getElementById("evo").innerHTML =
            "<div class='section'>Evolution failed to load</div>";
    }
}

async function load(){

    const p = await fetch(`/api/pokemon/${id}`).then(r=>r.json());
    const s = await fetch(`/api/pokemon-species/${p.species.name}`).then(r=>r.json());

    const entryObj =
        s.flavor_text_entries.find(e=>e.language.name===lang)
        || s.flavor_text_entries.find(e=>e.language.name==="en");

    const entry = fix(entryObj?.flavor_text);

    const types = p.types.map(t=>
        `<span class="typeBadge" style="background:${typeColors[t.type.name]}">
            ${t.type.name.toUpperCase()}
        </span>`
    ).join("");

    const abilities = p.abilities.map(a=>
        `<div class="row"><b>Ability</b><span>${a.ability.name.toUpperCase()}</span></div>`
    ).join("");

    const stats = p.stats.map(x=>
        `<div class="row"><b>${x.stat.name.toUpperCase()}</b><span>${x.base_stat}</span></div>`
    ).join("");

    const cry = p.cries?.latest || p.cries?.legacy;

    document.getElementById("content").innerHTML = `
    <div class="container">

        <div class="headerRow">
            <div class="title">${p.name.toUpperCase()}</div>
            <button class="printBtn" onclick="window.print()">🖨 Print</button>
        </div>

        <div>#${p.id}</div>

        <div class="navRow">
            <button class="navBtn" onclick="nav(-1)">⬅</button>

            <div class="centerCol">
                <img src="${p.sprites.other?.["official-artwork"]?.front_default || p.sprites.front_default}">
                <button onclick="playCry('${cry}')">🔊 Cry</button>
            </div>

            <button class="navBtn" onclick="nav(1)">➡</button>
        </div>

        <div class="section">
            <h3>Types</h3>
            ${types}
        </div>

        <div class="section">
            <h3>Abilities</h3>
            ${abilities}
        </div>

        <div class="section">
            <h3>Stats</h3>
            ${stats}
        </div>

        <div class="section">
            <h3>Pokédex Entry</h3>
            <p>${entry}</p>
        </div>

        <div class="section">
            <h3>Region</h3>
            <div class="regionBtn" onclick="alert('Region page not implemented yet')">
                ${region(p.id)}
            </div>
        </div>

        <div id="evo">Loading...</div>

        <div class="footer">
            <a href="/pokemon_list.html">Back to List</a>
            <a href="/start.html">Home</a>
        </div>

    </div>
    `;

    loadEvolution(p.species.name);
}

load();

</script>

</body>
</html>
