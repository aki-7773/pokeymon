<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Search Results - Pokémon Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s;
            padding: 20px;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        h1 {
            color: #2a75bb;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        body.dark-mode h1 {
            color: #ffcb05;
        }
        
        .search-query {
            color: #ff9800;
            margin-bottom: 20px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            max-width: 500px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 40px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        
        .search-box button {
            padding: 12px 30px;
            background: #ffcb05;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .results-count {
            margin: 20px 0;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        
        body.dark-mode .result-card {
            background: rgba(30,30,40,0.9);
        }
        
        .result-card:hover {
            transform: translateY(-5px);
            border-color: #ffcb05;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        
        .result-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }
        
        .result-info h3 {
            color: #2a75bb;
            margin-bottom: 5px;
        }
        
        body.dark-mode .result-info h3 {
            color: #ffcb05;
        }
        
        .result-info p {
            color: #666;
            font-size: 12px;
        }
        
        body.dark-mode .result-info p {
            color: #aaa;
        }
        
        .type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
            color: white;
            font-size: 10px;
            margin-right: 5px;
            margin-top: 5px;
        }
        
        .no-results {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            background: #2a75bb;
            color: white;
            text-decoration: none;
            border-radius: 40px;
            transition: all 0.3s;
        }
        
        .back-link:hover {
            background: #ffcb05;
            color: #2a75bb;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
        }
        
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .container { padding: 20px; }
            h1 { font-size: 24px; }
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔍 Search Results</h1>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search Pokémon...">
        <button onclick="performSearch()">Search</button>
    </div>
    
    <div id="resultsContainer">
        <div class="loading"><div class="loader"></div><p>Searching...</p></div>
    </div>
    
    <a href="start.html" class="back-link">← Back to Home</a>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let searchQuery = urlParams.get('q') || '';
    let allPokemon = [];
    
    document.getElementById('searchInput').value = searchQuery;
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') performSearch();
    });
    
    function performSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (query) {
            window.location.href = `search_results.html?q=${encodeURIComponent(query)}`;
        }
    }
    
    const typeColors = {
        normal: "#A8A77A", fire: "#EE8130", water: "#6390F0",
        electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6",
        fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65",
        flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A",
        rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC",
        dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD"
    };
    
    async function loadAndSearch() {
        const container = document.getElementById('resultsContainer');
        
        if (!searchQuery || searchQuery.length < 2) {
            container.innerHTML = `<div class="no-results"><p>⚠️ Please enter at least 2 characters to search.</p></div>`;
            return;
        }
        
        container.innerHTML = '<div class="loading"><div class="loader"></div><p>Searching Pokémon...</p></div>';
        
        try {
            // Lade alle Pokémon von der API (nur IDs 1-1025, KEINE Specials)
            const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
            const data = await response.json();
            
            const results = [];
            
            for (const item of data.results) {
                const pokeId = parseInt(item.url.split('/').slice(-2)[0]);
                // NUR normale Pokémon (IDs 1-1025, keine Spezialformen > 10000)
                if (pokeId <= 1025 && pokeId < 10000) {
                    const name = item.name;
                    if (name.toLowerCase().includes(searchQuery.toLowerCase())) {
                        try {
                            const detailRes = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokeId}`);
                            const detail = await detailRes.json();
                            results.push({
                                id: pokeId,
                                name: name.charAt(0).toUpperCase() + name.slice(1),
                                types: detail.types.map(t => t.type.name),
                                image: detail.sprites.other['official-artwork'].front_default || detail.sprites.front_default
                            });
                        } catch(e) {
                            results.push({
                                id: pokeId,
                                name: name.charAt(0).toUpperCase() + name.slice(1),
                                types: [],
                                image: null
                            });
                        }
                    }
                }
            }
            
            if (results.length === 0) {
                container.innerHTML = `<div class="no-results"><p>⚠️ No Pokémon found matching "${searchQuery}"</p><p>Try a different name or check your spelling.</p></div>`;
                return;
            }
            
            // Bestimme Generation für jedes Ergebnis
            const resultsWithGen = results.map(r => {
                let gen = 1;
                if (r.id <= 151) gen = 1;
                else if (r.id <= 251) gen = 2;
                else if (r.id <= 386) gen = 3;
                else if (r.id <= 493) gen = 4;
                else if (r.id <= 649) gen = 5;
                else if (r.id <= 721) gen = 6;
                else if (r.id <= 809) gen = 7;
                else if (r.id <= 905) gen = 8;
                else gen = 9;
                return { ...r, generation: gen };
            });
            
            const detailPage = (id) => id <= 721 ? 'pokemon_detail.html' : 'pokemon_detail_api.html';
            
            container.innerHTML = `
                <div class="results-count">📊 Found ${resultsWithGen.length} Pokémon matching "${searchQuery}"</div>
                <div class="results-grid">
                    ${resultsWithGen.map(r => `
                        <div class="result-card" onclick="location.href='${detailPage(r.id)}?id=${r.id}'">
                            <img src="${r.image || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${r.id}.png`}" 
                                 alt="${r.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'">
                            <div class="result-info">
                                <h3>${r.name}</h3>
                                <p>#${String(r.id).padStart(3, '0')} | Generation ${r.generation}</p>
                                <div>
                                    ${r.types.map(t => `<span class="type-badge" style="background: ${typeColors[t]}">${t.toUpperCase()}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
        } catch(error) {
            console.error('Search error:', error);
            container.innerHTML = `<div class="no-results"><p>❌ Error loading Pokémon data. Please try again.</p></div>`;
        }
    }
    
    loadAndSearch();
</script>
</body>
</html>
