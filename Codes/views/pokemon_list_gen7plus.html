<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pokémon List - Generation 7-9</title>
    <style>
        /* Gleiche Styles wie pokemon_list.html */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s;
            position: relative;
        }
        body.dark-mode { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 45px 45px;
            pointer-events: none;
            z-index: 0;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        h1 { text-align: center; color: white; font-size: 42px; margin: 25px 0; text-shadow: 4px 4px 8px rgba(0,0,0,0.3); }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: rgba(0,0,0,0.2);
            padding: 12px 20px;
            border-radius: 50px;
        }
        .back-link { display: inline-block; padding: 10px 22px; background: rgba(0,0,0,0.4); color: white; text-decoration: none; border-radius: 40px; font-weight: bold; transition: all 0.3s; }
        .back-link:hover { background: #ffcb05; color: #2a75bb; }
        .profile-btn { display: flex; align-items: center; gap: 8px; background: rgba(42,117,187,0.9); color: white; padding: 10px 18px; border-radius: 40px; text-decoration: none; font-weight: bold; transition: all 0.3s; }
        .profile-btn:hover { background: #ffcb05; color: #2a75bb; }
        .search-suggestions { position: relative; display: inline-block; flex: 1; max-width: 350px; }
        .search-suggestions input { width: 100%; padding: 12px 20px; border-radius: 40px; border: none; font-size: 15px; background: rgba(255,255,255,0.95); }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border-radius: 20px; max-height: 350px; overflow-y: auto; z-index: 1000; display: none; margin-top: 8px; }
        .suggestions-box div { padding: 12px 18px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .suggestions-box div:hover { background: #ffcb05; color: #2a75bb; }
        .control-buttons { display: flex; gap: 12px; align-items: center; }
        .dark-mode-toggle, .language-select { background: #2a75bb; color: white; border: none; padding: 10px 18px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { display: inline-block; padding: 10px 18px; background: rgba(0,0,0,0.35); color: white; text-decoration: none; border-radius: 40px; font-weight: bold; }
        .nav-btn:hover { background: #ffcb05; color: #2a75bb; }
        .type-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 25px 0;
            padding: 18px;
            background: rgba(255,255,255,0.92);
            border-radius: 50px;
        }
        body.dark-mode .type-filters { background: rgba(0,0,0,0.75); }
        .type-btn { padding: 8px 18px; border: none; border-radius: 30px; cursor: pointer; font-weight: bold; transition: all 0.25s; color: white; font-size: 13px; text-transform: uppercase; }
        .type-btn:hover { transform: translateY(-2px); }
        .type-btn.active { box-shadow: 0 0 0 3px white, 0 0 0 5px #2a75bb; }
        .type-btn.all { background: #2a75bb; }
        .pokemon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 25px;
            margin-top: 25px;
        }
        .pokemon-card {
            background: rgba(255,255,255,0.96);
            border-radius: 24px;
            padding: 18px 15px 20px;
            text-align: center;
            transition: all 0.35s;
            cursor: pointer;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        body.dark-mode .pokemon-card { background: rgba(0,0,0,0.85); color: #f0f0f0; }
        .pokemon-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 20px 35px rgba(0,0,0,0.2); }
        .pokemon-card img { width: 130px; height: 130px; transition: transform 0.3s; }
        .pokemon-card:hover img { transform: scale(1.08); }
        .pokemon-card h3 { color: #2a75bb; margin: 12px 0 6px; font-size: 20px; }
        body.dark-mode .pokemon-card h3 { color: #ffcb05; }
        .pokemon-number { color: #777; font-size: 13px; margin-bottom: 8px; }
        .type-badges { display: flex; justify-content: center; gap: 8px; margin: 12px 0 8px; flex-wrap: wrap; }
        .type-badge { display: inline-block; padding: 4px 14px; border-radius: 25px; color: white; font-size: 11px; font-weight: bold; }
        .favorite-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: #ddd;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .favorite-btn.favorited { color: gold; }
        .gen-badge { display: inline-block; background: linear-gradient(135deg, #ff9800, #f57c00); color: white; font-size: 10px; padding: 4px 10px; border-radius: 20px; margin-top: 8px; }
        .loading { text-align: center; padding: 70px; color: white; }
        .loader { border: 4px solid rgba(255,255,255,0.3); border-top: 4px solid #ffcb05; border-radius: 50%; width: 55px; height: 55px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .stats-info { text-align: center; margin: 15px 0; color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.2); display: inline-block; padding: 6px 20px; border-radius: 40px; }
        .stats-wrapper { text-align: center; }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            h1 { font-size: 32px; }
            .pokemon-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .type-filters { gap: 8px; padding: 12px; }
            .type-btn { padding: 6px 12px; font-size: 11px; }
            .top-bar { flex-direction: column; align-items: stretch; }
            .search-suggestions { max-width: 100%; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🌟 Generation 7-9 Pokédex 🌟</h1>
    
    <div class="top-bar">
        <a href="start.html" class="back-link">🏠 Home</a>
        <a href="profile.html" class="profile-btn">👤 Profile</a>
        <a href="pokemon_list.html" class="back-link">📋 Gen 1-6</a>
        
        <div class="search-suggestions">
            <input type="text" id="searchInput" placeholder="🔍 Search Pokémon...">
            <div id="suggestions" class="suggestions-box"></div>
        </div>
        
        <div class="control-buttons">
            <button class="dark-mode-toggle" id="darkModeBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
            <select class="language-select" id="languageSelect" onchange="changeLanguage(this.value)">
                <option value="en">🇬🇧 English</option>
                <option value="de">🇩🇪 Deutsch</option>
            </select>
        </div>
        
        <div class="nav-buttons">
            <a href="team.html" class="nav-btn">⭐ My Team</a>
            <a href="compare.html" class="nav-btn">📊 Compare</a>
            <a href="type_chart.html" class="nav-btn">⚔️ Type Chart</a>
            <a href="quiz.html" class="nav-btn">🎮 Quiz</a>
        </div>
    </div>
    
    <div class="type-filters" id="typeFilters">
        <button class="type-btn all active" data-type="all">All</button>
    </div>
    
    <div class="stats-wrapper">
        <div class="stats-info" id="statsInfo"></div>
    </div>
    
    <div id="pokemonGrid" class="pokemon-grid">
        <div class="loading"><div class="loader"></div><p>Loading Pokédex...</p></div>
    </div>
</div>

<script>
    let allPokemon = [];
    let currentTypeFilter = 'all';
    let favoritePokemon = JSON.parse(localStorage.getItem('favorites') || '[]');
    let currentLanguage = localStorage.getItem('language') || 'en';
    
    const typeColorMap = {
        normal: "#A8A77A", fire: "#EE8130", water: "#6390F0",
        electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6",
        fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65",
        flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A",
        rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC",
        dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD"
    };
    
    const allTypes = ["normal", "fire", "water", "electric", "grass", "ice", "fighting", "poison", "ground", "flying", "psychic", "bug", "rock", "ghost", "dragon", "dark", "steel", "fairy"];
    
    const filterContainer = document.getElementById('typeFilters');
    allTypes.forEach(type => {
        const btn = document.createElement('button');
        btn.className = 'type-btn';
        btn.style.backgroundColor = typeColorMap[type];
        btn.setAttribute('data-type', type);
        btn.textContent = type.charAt(0).toUpperCase() + type.slice(1);
        btn.onclick = () => applyTypeFilter(type);
        filterContainer.appendChild(btn);
    });
    
    async function loadPokemon() {
        const gridContainer = document.getElementById('pokemonGrid');
        gridContainer.innerHTML = '<div class="loading"><div class="loader"></div><p>Loading Pokédex...</p></div>';
        
        try {
            const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000');
            const data = await response.json();
            
            const tempPokemonList = [];
            
            for (const item of data.results) {
                const pokeId = parseInt(item.url.split('/').slice(-2)[0]);
                // NUR Gen 7-9 (IDs 722-1025) und keine Specials
                if (pokeId >= 722 && pokeId <= 1025 && pokeId < 10000) {
                    let generation = 7;
                    if (pokeId <= 809) generation = 7;
                    else if (pokeId <= 905) generation = 8;
                    else generation = 9;
                    
                    try {
                        const detailsResponse = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokeId}`);
                        const details = await detailsResponse.json();
                        tempPokemonList.push({
                            id: pokeId,
                            name: item.name.charAt(0).toUpperCase() + item.name.slice(1),
                            rawName: item.name,
                            generation: generation,
                            types: details.types.map(t => t.type.name)
                        });
                    } catch (err) {
                        tempPokemonList.push({
                            id: pokeId,
                            name: item.name.charAt(0).toUpperCase() + item.name.slice(1),
                            rawName: item.name,
                            generation: generation,
                            types: []
                        });
                    }
                }
            }
            
            tempPokemonList.sort((a, b) => a.id - b.id);
            allPokemon = tempPokemonList;
            updateStats();
            renderGrid();
        } catch (error) {
            gridContainer.innerHTML = '<div class="loading"><p>❌ Error loading Pokémon data.</p></div>';
        }
    }
    
    function updateStats() {
        document.getElementById('statsInfo').innerHTML = `📊 Total: ${allPokemon.length} Pokémon | ⭐ Favorites: ${favoritePokemon.filter(id => id < 10000).length}/6`;
    }
    
    function renderGrid() {
        const gridContainer = document.getElementById('pokemonGrid');
        let filteredList = [...allPokemon];
        
        if (currentTypeFilter !== 'all') {
            filteredList = filteredList.filter(p => p.types && p.types.includes(currentTypeFilter));
        }
        
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        if (searchTerm.length >= 2) {
            filteredList = filteredList.filter(p => p.name.toLowerCase().includes(searchTerm) || p.rawName.includes(searchTerm));
        }
        
        if (filteredList.length === 0) {
            gridContainer.innerHTML = '<div class="loading"><p>⚠️ No Pokémon match your search.</p></div>';
            return;
        }
        
        gridContainer.innerHTML = filteredList.map(pokemon => `
            <div class="pokemon-card" onclick="navigateToDetail(${pokemon.id})">
                <button class="favorite-btn ${favoritePokemon.includes(pokemon.id) ? 'favorited' : ''}" 
                        onclick="event.stopPropagation(); toggleFavorite(${pokemon.id})">
                    ${favoritePokemon.includes(pokemon.id) ? '★' : '☆'}
                </button>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemon.id}.png" 
                     alt="${pokemon.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${pokemon.id}.png'">
                <h3>${pokemon.name}</h3>
                <div class="pokemon-number">#${String(pokemon.id).padStart(3, '0')}</div>
                <div class="type-badges">
                    ${pokemon.types.map(t => `<span class="type-badge" style="background: ${typeColorMap[t]}">${t.toUpperCase()}</span>`).join('')}
                </div>
                <div class="gen-badge">Gen ${pokemon.generation}</div>
            </div>
        `).join('');
    }
    
    function applyTypeFilter(type) {
        currentTypeFilter = type;
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-type') === type) btn.classList.add('active');
        });
        renderGrid();
    }
    
    function toggleFavorite(pokemonId) {
        if (favoritePokemon.includes(pokemonId)) {
            favoritePokemon = favoritePokemon.filter(id => id !== pokemonId);
        } else if (favoritePokemon.length < 6) {
            favoritePokemon.push(pokemonId);
        } else {
            alert('You can only have 6 Pokémon in your team!');
            return;
        }
        localStorage.setItem('favorites', JSON.stringify(favoritePokemon));
        updateStats();
        renderGrid();
    }
    
    function navigateToDetail(pokemonId) {
        if (pokemonId <= 721) {
            window.location.href = `pokemon_detail.html?id=${pokemonId}`;
        } else {
            window.location.href = `pokemon_detail_api.html?id=${pokemonId}`;
        }
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    function setupSearchSuggestions() {
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            renderGrid();
            if (query.length < 2) { suggestionsBox.style.display = 'none'; return; }
            const matches = allPokemon.filter(p => p.name.toLowerCase().includes(query)).slice(0, 12);
            if (matches.length > 0) {
                suggestionsBox.style.display = 'block';
                suggestionsBox.innerHTML = matches.map(p => `<div onclick="navigateToDetail(${p.id})">${p.name} (#${String(p.id).padStart(3, '0')})</div>`).join('');
            } else { suggestionsBox.style.display = 'none'; }
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-suggestions')) suggestionsBox.style.display = 'none';
        });
    }
    
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
    }
    document.getElementById('languageSelect').value = currentLanguage;
    setupSearchSuggestions();
    loadPokemon();
</script>
</body>
</html>
