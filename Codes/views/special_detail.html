<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Special Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
        }
        
        .cry-button {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            background: #2a75bb;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .cry-button:hover {
            background: #ffcb05;
            color: #2a75bb;
        }
        
        .type-badge-mega {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-gmax {
            display: inline-block;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;
            border-radius: 24px;
        }
        
        .info-card {
            background: white;
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        
        body.dark-mode .info-card {
            background: rgba(30,30,40,0.9);
        }
        
        .info-label {
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 6px;
        }
        
        body.dark-mode .info-label {
            color: #ffcb05;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 600;
        }
        
        .types-section, .abilities-section {
            margin: 20px 0;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 12px;
            border-left: 4px solid #ffcb05;
            padding-left: 15px;
        }
        
        body.dark-mode .section-title {
            color: #ffcb05;
        }
        
        .type-badge-list, .ability-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            padding: 0;
        }
        
        .type-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .ability-item {
            background: #e8e8e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
        }
        
        body.dark-mode .ability-item {
            background: #3a3a4a;
            color: #eee;
        }
        
        .stats-container {
            margin: 25px 0;
        }
        
        .stat-row {
            margin: 14px 0;
        }
        
        .stat-name {
            font-weight: bold;
            display: inline-block;
            width: 100px;
        }
        
        .stat-bar-bg {
            background: #e0e0e0;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        body.dark-mode .stat-bar-bg {
            background: #3a3a4a;
        }
        
        .stat-bar-fill {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 12px;
            font-weight: bold;
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        
        .dex-entry {
            background: #f5f0e8;
            padding: 20px;
            border-radius: 24px;
            margin: 25px 0;
            font-style: italic;
            line-height: 1.6;
            border-left: 5px solid #ffcb05;
        }
        
        body.dark-mode .dex-entry {
            background: #2a2a3a;
            color: #ddd;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ffcb05;
            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
        }
        
        .loader-small {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            body { padding: 15px; }
            .container { padding: 20px; }
            .pokemon-image { width: 200px; height: 200px; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<a href="profile.html" class="profile-btn">👤 Profile</a>
<a href="javascript:history.back()" class="back-link">← Back</a>

<div class="control-buttons">
    <button class="dark-mode-toggle" id="darkModeBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    <select class="language-select" id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
    </select>
</div>

<div class="container" id="mainContainer">
    <div class="loader-small"></div>
    <p style="text-align: center;">Loading special form data...</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const basePokemonId = parseInt(urlParams.get('pokemon')) || 6;
    const formType = urlParams.get('type') || 'mega';
    const formName = urlParams.get('name') || 'Special Form';
    
    let currentLanguage = localStorage.getItem('language') || 'en';
    let currentCryUrl = null;
    
    const typeColors = {
        normal: "#A8A77A", fire: "#EE8130", water: "#6390F0",
        electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6",
        fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65",
        flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A",
        rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC",
        dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD"
    };
    
    // VOLLSTÄNDIGE SPEZIALFORMEN DATEN mit Bildern, korrekten Types, Sounds, Pokédex
    const specialFormData = {
        // ========== CHARIZARD ==========
        "6-mega-x": {
            name: "Mega Charizard X",
            types: ["fire", "dragon"],
            imageSuffix: "6",
            height: 1.7,
            weight: 110.5,
            ability: "Tough Claws",
            hp: 78, attack: 130, defense: 111, spAttack: 130, spDefense: 85, speed: 100,
            dex: "Mega Charizard X is a powerful Dragon-type form. Its blue flames burn hotter than ever before, and its physical strength is dramatically increased. The black coloration comes from intense heat that has scorched its body.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/6.ogg"
        },
        "6-mega-y": {
            name: "Mega Charizard Y",
            types: ["fire", "flying"],
            imageSuffix: "6",
            height: 1.7,
            weight: 100.5,
            ability: "Drought",
            hp: 78, attack: 104, defense: 78, spAttack: 159, spDefense: 115, speed: 100,
            dex: "Mega Charizard Y has immense special attack power. Its wings create intense heat that can melt anything around it. The Drought ability summons harsh sunlight that powers up its Fire-type moves.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/6.ogg"
        },
        "6-gigantamax": {
            name: "Gigantamax Charizard",
            types: ["fire", "flying"],
            imageSuffix: "6",
            height: 28.0,
            weight: 999.9,
            ability: "Blaze",
            hp: 78, attack: 104, defense: 78, spAttack: 159, spDefense: 115, speed: 100,
            dex: "Gigantamax Charizard's flames never go out. Its wings are covered in intense fire that can burn anything to ashes. The energy from Gigantamaxing has caused its flames to burn at temperatures exceeding 3,000 degrees Fahrenheit.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/6.ogg"
        },
        // ========== MEWTWO ==========
        "150-mega-x": {
            name: "Mega Mewtwo X",
            types: ["psychic", "fighting"],
            imageSuffix: "150",
            height: 2.3,
            weight: 127.0,
            ability: "Steadfast",
            hp: 106, attack: 190, defense: 100, spAttack: 154, spDefense: 100, speed: 130,
            dex: "Mega Mewtwo X focuses its immense psychic power into physical combat, making it a devastating fighter. Its muscles are amplified by psychic energy, giving it tremendous physical strength.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/150.ogg"
        },
        "150-mega-y": {
            name: "Mega Mewtwo Y",
            types: ["psychic"],
            imageSuffix: "150",
            height: 1.5,
            weight: 33.0,
            ability: "Insomnia",
            hp: 106, attack: 150, defense: 70, spAttack: 194, spDefense: 120, speed: 140,
            dex: "Mega Mewtwo Y has reached the peak of psychic ability. Its mental powers can bend reality itself. The reduced body mass allows it to focus all its energy into psychic attacks.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/150.ogg"
        },
        // ========== GENGAR ==========
        "94-mega": {
            name: "Mega Gengar",
            types: ["ghost", "poison"],
            imageSuffix: "94",
            height: 1.4,
            weight: 40.5,
            ability: "Shadow Tag",
            hp: 60, attack: 65, defense: 80, spAttack: 170, spDefense: 95, speed: 130,
            dex: "Mega Gengar can trap opponents with its Shadow Tag ability, making escape impossible. Its third eye allows it to see into the spirit world and curse its opponents.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/94.ogg"
        },
        "94-gigantamax": {
            name: "Gigantamax Gengar",
            types: ["ghost", "poison"],
            imageSuffix: "94",
            height: 20.0,
            weight: 999.9,
            ability: "Cursed Body",
            hp: 60, attack: 65, defense: 80, spAttack: 170, spDefense: 95, speed: 130,
            dex: "Gigantamax Gengar's mouth stretches to the underworld, dragging anything nearby into the darkness. It's said that the energy of Gigantamaxing has opened a portal to the afterlife.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/94.ogg"
        },
        // ========== PIKACHU ==========
        "25-gigantamax": {
            name: "Gigantamax Pikachu",
            types: ["electric"],
            imageSuffix: "25",
            height: 21.0,
            weight: 999.9,
            ability: "Static",
            hp: 45, attack: 80, defense: 50, spAttack: 75, spDefense: 60, speed: 120,
            dex: "Gigantamax Pikachu's tail grows enormously. It can generate enough electricity to power an entire city. Thunderclouds form around its body whenever it gets excited.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/25.ogg"
        },
        // ========== GYARADOS ==========
        "130-mega": {
            name: "Mega Gyarados",
            types: ["water", "dark"],
            imageSuffix: "130",
            height: 6.5,
            weight: 305.0,
            ability: "Mold Breaker",
            hp: 95, attack: 155, defense: 109, spAttack: 70, spDefense: 130, speed: 81,
            dex: "Mega Gyarados becomes a Dark-type. Its rage is so intense that it destroys everything in its path. The Mega Evolution energy has awakened its primal destructive instincts.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/130.ogg"
        },
        // ========== LUCARIO ==========
        "448-mega": {
            name: "Mega Lucario",
            types: ["fighting", "steel"],
            imageSuffix: "448",
            height: 1.3,
            weight: 57.5,
            ability: "Adaptability",
            hp: 70, attack: 145, defense: 88, spAttack: 140, spDefense: 70, speed: 112,
            dex: "Mega Lucario can read the aura of opponents perfectly, predicting their every move. The spikes on its hands and feet extend, allowing it to sense auras from great distances.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/448.ogg"
        },
        // ========== BLAZIKEN ==========
        "257-mega": {
            name: "Mega Blaziken",
            types: ["fire", "fighting"],
            imageSuffix: "257",
            height: 1.9,
            weight: 52.0,
            ability: "Speed Boost",
            hp: 80, attack: 160, defense: 80, spAttack: 130, spDefense: 80, speed: 100,
            dex: "Mega Blaziken's legs become even more powerful, allowing it to kick with incredible force. The flames on its wrists burn hotter as it gains speed with each turn.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/257.ogg"
        },
        // ========== GARCHOMP ==========
        "445-mega": {
            name: "Mega Garchomp",
            types: ["dragon", "ground"],
            imageSuffix: "445",
            height: 1.9,
            weight: 95.0,
            ability: "Sand Force",
            hp: 108, attack: 170, defense: 115, spAttack: 120, spDefense: 95, speed: 92,
            dex: "Mega Garchomp's arm blades become scythe-like, capable of cutting through steel. Its speed decreases slightly but its raw power increases dramatically.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/445.ogg"
        },
        // ========== AMPHAROS ==========
        "181-mega": {
            name: "Mega Ampharos",
            types: ["electric", "dragon"],
            imageSuffix: "181",
            height: 1.4,
            weight: 61.5,
            ability: "Mold Breaker",
            hp: 90, attack: 95, defense: 105, spAttack: 165, spDefense: 110, speed: 45,
            dex: "Mega Ampharos grows fabulous flowing hair and gains the Dragon type. The glowing orb on its tail becomes even brighter, illuminating entire caves.",
            cry: "https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/181.ogg"
        }
    };
    
    const formKey = `${basePokemonId}-${formType}`;
    let formData = specialFormData[formKey];
    
    // Fallback für nicht definierte Spezialformen
    if (!formData) {
        formData = {
            name: formName,
            types: ["fire", "flying"],
            imageSuffix: basePokemonId,
            height: 1.7,
            weight: 90.5,
            ability: "Blaze",
            hp: 78, attack: 104, defense: 78, spAttack: 159, spDefense: 115, speed: 100,
            dex: `This is a special form of Pokémon #${basePokemonId}. These special forms have unique abilities and appearances that differ from their normal counterparts!`,
            cry: `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${basePokemonId}.ogg`
        };
    }
    
    currentCryUrl = formData.cry;
    
    function playCry() {
        if (currentCryUrl) {
            const audio = new Audio(currentCryUrl);
            audio.volume = 0.3;
            audio.play().catch(e => console.log('Cry playback failed'));
        }
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
    }
    document.getElementById('languageSelect').value = localStorage.getItem('language') || 'en';
    
    function loadSpecialForm() {
        const container = document.getElementById('mainContainer');
        
        const totalStats = formData.hp + formData.attack + formData.defense + formData.spAttack + formData.spDefense + formData.speed;
        
        const badgeClass = formType.includes('mega') ? 'type-badge-mega' : 'type-badge-gmax';
        const badgeText = formType.includes('mega') ? '⚡ MEGA EVOLUTION' : '💥 GIGANTAMAX';
        
        // Bild-URL für Spezialform
        const imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${formData.imageSuffix}.png`;
        
        container.innerHTML = `
            <div class="pokemon-header">
                <h1>${formData.name} <span class="${badgeClass}">${badgeText}</span></h1>
            </div>
            
            <div class="pokemon-image-container">
                <img class="pokemon-image" src="${imageUrl}" 
                     alt="${formData.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${formData.imageSuffix}.png'">
            </div>
            
            <button class="cry-button" onclick="playCry()">🔊 Play Cry</button>
            
            <div class="info-grid">
                <div class="info-card"><div class="info-label">📏 Height</div><div class="info-value">${formData.height} m</div></div>
                <div class="info-card"><div class="info-label">⚖️ Weight</div><div class="info-value">${formData.weight} kg</div></div>
                <div class="info-card"><div class="info-label">✨ Ability</div><div class="info-value">${formData.ability}</div></div>
                <div class="info-card"><div class="info-label">📊 Total Stats</div><div class="info-value">${totalStats}</div></div>
            </div>
            
            <div class="types-section">
                <div class="section-title">🌈 Types</div>
                <ul class="type-badge-list">
                    ${formData.types.map(t => `<li class="type-badge" style="background: ${typeColors[t]}">${t.toUpperCase()}</li>`).join('')}
                </ul>
            </div>
            
            <div class="abilities-section">
                <div class="section-title">✨ Special Ability</div>
                <ul class="ability-list">
                    <li class="ability-item">${formData.ability}</li>
                </ul>
            </div>
            
            <div class="stats-container">
                <div class="section-title">📊 Base Stats (Special Form)</div>
                <div class="stat-row"><span class="stat-name">❤️ HP</span> ${formData.hp}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.hp/255)*100}%">${formData.hp}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚔️ Attack</span> ${formData.attack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.attack/255)*100}%">${formData.attack}</div></div></div>
                <div class="stat-row"><span class="stat-name">🛡️ Defense</span> ${formData.defense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.defense/255)*100}%">${formData.defense}</div></div></div>
                <div class="stat-row"><span class="stat-name">🔮 Sp. Attack</span> ${formData.spAttack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spAttack/255)*100}%">${formData.spAttack}</div></div></div>
                <div class="stat-row"><span class="stat-name">✨ Sp. Defense</span> ${formData.spDefense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spDefense/255)*100}%">${formData.spDefense}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚡ Speed</span> ${formData.speed}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.speed/255)*100}%">${formData.speed}</div></div></div>
            </div>
            
            <div class="dex-entry">
                <strong>📖 Special Form Pokédex Entry</strong><br>
                "${formData.dex}"
            </div>
            
            <div style="text-align: center;">
                <a href="pokemon_detail.html?id=${basePokemonId}" class="back-button">← Back to ${basePokemonId === 6 ? 'Charizard' : basePokemonId === 25 ? 'Pikachu' : basePokemonId === 150 ? 'Mewtwo' : 'Pokémon'}</a>
                <a href="pokemon_list.html" class="back-button" style="margin-left: 15px;">📋 Pokédex</a>
            </div>
        `;
    }
    
    loadSpecialForm();
</script>
</body>
</html>
