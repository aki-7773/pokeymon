<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Special Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
            background: transparent;
        }
        
        .cry-button {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            background: #2a75bb;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .cry-button:hover {
            background: #ffcb05;
            color: #2a75bb;
        }
        
        .type-badge-mega {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-gmax {
            display: inline-block;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-primal {
            display: inline-block;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;

            color: #eee;
        }

            display: inline-block;
            width: 100px;
        }

            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        body.dark-mode .stat-bar-bg {
            background: #3a3a4a;
        }

            background: linear-gradient(90deg, #ff9800, #f57c00);
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 12px;
            font-weight: bold;
            border-radius: 20px;

            padding: 20px;
            border-radius: 24px;
            margin: 25px 0;
            font-style: italic;
            line-height: 1.6;
            border-left: 5px solid #ffcb05;
        }

            background: #2a2a3a;
            color: #ddd;
        }

            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ffcb05;
            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
        }

            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            body { padding: 15px; }
            .container { padding: 20px; }
            .pokemon-image { width: 200px; height: 200px; }
            .info-grid { grid-template-columns: 1fr; }
            .profile-btn, .control-buttons { top: 10px; }
            .profile-btn { left: 10px; padding: 6px 12px; font-size: 12px; }

</head>

            spAttack: 100, spDefense: 100, speed: 100,
            dex: `${formName} is a special form of Pokémon #${basePokemonId}.`
        };
    }
    
    const cryUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${basePokemonId}.ogg`;
    
    function playCry() {
        const audio = new Audio(cryUrl);
        audio.volume = 0.3;
        audio.play().catch(e => console.log('Playback failed'));
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
    }
    document.getElementById('languageSelect').value = localStorage.getItem('language') || 'en';
    
    function loadSpecialForm() {
        const container = document.getElementById('mainContainer');
        const totalStats = formData.hp + formData.attack + formData.defense + 
                          formData.spAttack + formData.spDefense + formData.speed;
        
        let badgeClass = 'type-badge-mega';
        let badgeText = '⚡ MEGA EVOLUTION';
        if (formKey === 'gmax') { badgeClass = 'type-badge-gmax'; badgeText = '💥 GIGANTAMAX'; }
        else if (formKey === 'primal') { badgeClass = 'type-badge-primal'; badgeText = '🌊 PRIMAL REVERSION'; }
        else if (formKey === 'bond') { badgeClass = 'type-badge-bond'; badgeText = '🤝 BATTLE BOND'; }
        else if (formKey === 'alolan' || formKey === 'galarian' || formKey === 'hisuian' || formKey === 'paldean') 
            { badgeClass = 'type-badge-regional'; badgeText = '🌍 REGIONAL FORM'; }
        
        const imageUrl = getImageUrlForForm(basePokemonId, formKey, formName);
        const fallbackUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${basePokemonId}.png`;
        
        container.innerHTML = `

                <h1>${formName} <span class="${badgeClass}">${badgeText}</span></h1>
            </div>
            <div class="pokemon-image-container">
                <img class="pokemon-image" src="${imageUrl}" alt="${formName}"
