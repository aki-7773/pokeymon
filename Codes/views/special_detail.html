<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Special Form - Complete Info</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
            position: relative;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255,255,255,0.06) 2px, transparent 2px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
            backdrop-filter: blur(2px);
            transition: all 0.3s;
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .nav-prev, .nav-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(42,117,187,0.9);
            color: white;
            width: 55px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            border-radius: 30px;
            transition: all 0.3s;
            z-index: 100;
            border: none;
            cursor: pointer;
            backdrop-filter: blur(5px);
            font-weight: bold;
        }
        
        .nav-prev {
            left: 20px;
        }
        
        .nav-next {
            right: 20px;
        }
        
        .nav-prev:hover, .nav-next:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: translateY(-50%) scale(1.05);
            width: 60px;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        
        .dark-mode-toggle:hover, .language-select:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: scale(1.03);
        }
        
        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        
        .profile-btn:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: scale(1.03);
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
            margin-bottom: 8px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-id {
            font-size: 16px;
            color: #777;
            font-weight: 500;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
            transition: transform 0.3s;
        }
        
        .pokemon-image:hover {
            transform: scale(1.03);
        }
        
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        
        .cry-button, .print-btn {
            background: #2a75bb;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 15px;
        }
        
        .cry-button:hover, .print-btn:hover {
            background: #ffcb05;
            color: #2a75bb;
            transform: scale(1.03);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;
            border-radius: 24px;
        }
        
        body.dark-mode .info-grid {
            background: rgba(255,255,255,0.05);
        }
        
        .info-card {
            background: white;
            padding: 14px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        body.dark-mode .info-card {
            background: rgba(30,30,40,0.9);
        }
        
        .info-label {
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 6px;
            font-size: 14px;
        }
        
        body.dark-mode .info-label {
            color: #ffcb05;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 600;
        }
        
        .types-section, .abilities-section {
            margin: 20px 0;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 12px;
            border-left: 4px solid #ffcb05;
            padding-left: 15px;
        }
        
        body.dark-mode .section-title {
            color: #ffcb05;
        }
        
        .type-badge-list, .ability-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            padding: 0;
        }
        
        .type-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .ability-item {
            background: #e8e8e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
        }
        
        body.dark-mode .ability-item {
            background: #3a3a4a;
            color: #eee;
        }
        
        .stats-container {
            margin: 25px 0;
        }
        
        .stat-row {
            margin: 14px 0;
        }
        
        .stat-name {
            font-weight: bold;
            margin-bottom: 5px;
            display: inline-block;
            width: 100px;
        }
        
        .stat-bar-bg {
            background: #e0e0e0;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        body.dark-mode .stat-bar-bg {
            background: #3a3a4a;
        }
        
        .stat-bar-fill {
            background: linear-gradient(90deg, #2a75bb, #4a95db);
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 12px;
            font-weight: bold;
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        
        .dex-entry {
            background: #f5f0e8;
            padding: 20px;
            border-radius: 24px;
            margin: 25px 0;
            font-style: italic;
            line-height: 1.6;
            border-left: 5px solid #ffcb05;
        }
        
        body.dark-mode .dex-entry {
            background: #2a2a3a;
            color: #ddd;
        }
        
        .category-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            font-size: 14px;
            padding: 5px 15px;
            border-radius: 25px;
            margin-left: 10px;
            vertical-align: middle;
        }
        
        .special-detail-badge {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 10px;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ffcb05;
            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            transition: all 0.3s;
            text-align: center;
        }
        
        .back-button:hover {
            background: #f5b700;
            transform: translateY(-2px);
        }
        
        .loader-small {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .container {
                padding: 20px;
            }
            .nav-prev, .nav-next {
                width: 45px;
                height: 70px;
                font-size: 32px;
            }
            .nav-prev {
                left: 5px;
            }
            .nav-next {
                right: 5px;
            }
            .pokemon-image {
                width: 200px;
                height: 200px;
            }
            .info-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .profile-btn, .control-buttons {
                top: 10px;
            }
            .profile-btn {
                left: 10px;
                padding: 6px 12px;
                font-size: 12px;
            }
            .dark-mode-toggle, .language-select {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
<a href="profile.html" class="profile-btn">👤 Profile</a>

<div class="control-buttons">
    <button class="dark-mode-toggle" id="darkModeBtn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
    <select class="language-select" id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="zh">🇨🇳 中文</option>
    </select>
</div>

<button class="nav-prev" onclick="navigatePrev()">◀</button>
<button class="nav-next" onclick="navigateNext()">▶</button>

<div class="container" id="mainContainer">
    <div class="loader-small" style="margin: 60px auto;"></div>
    <p style="text-align: center;">Loading special form data...</p>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentPokemonId = parseInt(urlParams.get('id')) || 10034;
    let pokemonData = null;
    let currentLanguage = localStorage.getItem('language') || 'en';
    
    // Spezielle Kategorien für die Anzeige
    const specialCategories = {
        10003: { name: "Ash-Greninja", category: "Bond Phenomenon", region: "Kalos" },
        // Mega Evolutions

        10041: { name: "Mega Ampharos", category: "Mega Evolution", region: "Kalos" },
        10042: { name: "Mega Steelix", category: "Mega Evolution", region: "Kalos" },
        10043: { name: "Mega Scizor", category: "Mega Evolution", region: "Kalos" },
        10044: { name: "Mega Heracross", category: "Mega Evolution", region: "Kalos" },
        10045: { name: "Mega Houndoom", category: "Mega Evolution", region: "Kalos" },
        10046: { name: "Mega Tyranitar", category: "Mega Evolution", region: "Kalos" },
        10047: { name: "Mega Blaziken", category: "Mega Evolution", region: "Kalos" },

        10052: { name: "Mega Medicham", category: "Mega Evolution", region: "Kalos" },
        10053: { name: "Mega Manectric", category: "Mega Evolution", region: "Kalos" },
        10054: { name: "Mega Sharpedo", category: "Mega Evolution", region: "Kalos" },
        10055: { name: "Mega Camerupt", category: "Mega Evolution", region: "Kalos" },
        10056: { name: "Mega Altaria", category: "Mega Evolution", region: "Kalos" },
        10057: { name: "Mega Banette", category: "Mega Evolution", region: "Kalos" },
        10058: { name: "Mega Absol", category: "Mega Evolution", region: "Kalos" },
        10059: { name: "Mega Glalie", category: "Mega Evolution", region: "Kalos" },
        10060: { name: "Mega Salamence", category: "Mega Evolution", region: "Kalos" },
        10061: { name: "Mega Metagross", category: "Mega Evolution", region: "Kalos" },
        10062: { name: "Mega Latias", category: "Mega Evolution", region: "Kalos" },
        10063: { name: "Mega Latios", category: "Mega Evolution", region: "Kalos" },
        10064: { name: "Mega Rayquaza", category: "Mega Evolution", region: "Kalos" },
        10065: { name: "Mega Lopunny", category: "Mega Evolution", region: "Kalos" },
        10066: { name: "Mega Garchomp", category: "Mega Evolution", region: "Kalos" },
        10067: { name: "Mega Lucario", category: "Mega Evolution", region: "Kalos" },
        10068: { name: "Mega Abomasnow", category: "Mega Evolution", region: "Kalos" },
        10069: { name: "Mega Gallade", category: "Mega Evolution", region: "Kalos" },
        10070: { name: "Mega Audino", category: "Mega Evolution", region: "Kalos" },
        10071: { name: "Mega Diancie", category: "Mega Evolution", region: "Kalos" },
        // Primal Forms
        10080: { name: "Primal Kyogre", category: "Primal Reversion", region: "Hoenn" },
        10081: { name: "Primal Groudon", category: "Primal Reversion", region: "Hoenn" },
        // Gigantamax Forms
        10072: { name: "Gigantamax Charizard", category: "Gigantamax", region: "Galar" },
        10073: { name: "Gigantamax Pikachu", category: "Gigantamax", region: "Galar" },
        10074: { name: "Gigantamax Eevee", category: "Gigantamax", region: "Galar" },
        10075: { name: "Gigantamax Meowth", category: "Gigantamax", region: "Galar" },
        10076: { name: "Gigantamax Gengar", category: "Gigantamax", region: "Galar" },
        10077: { name: "Gigantamax Lapras", category: "Gigantamax", region: "Galar" },
        10078: { name: "Gigantamax Snorlax", category: "Gigantamax", region: "Galar" },
        10079: { name: "Gigantamax Machamp", category: "Gigantamax", region: "Galar" },
        10082: { name: "Gigantamax Kingler", category: "Gigantamax", region: "Galar" },
        10083: { name: "Gigantamax Corviknight", category: "Gigantamax", region: "Galar" },
        // Regional Forms
        10100: { name: "Alolan Raichu", category: "Regional Form", region: "Alola" },
        10101: { name: "Alolan Marowak", category: "Regional Form", region: "Alola" },
        10102: { name: "Alolan Exeggutor", category: "Regional Form", region: "Alola" },
        10103: { name: "Galarian Ponyta", category: "Regional Form", region: "Galar" },
        10104: { name: "Galarian Rapidash", category: "Regional Form", region: "Galar" },
        10105: { name: "Galarian Slowbro", category: "Regional Form", region: "Galar" },
        10106: { name: "Hisuian Growlithe", category: "Regional Form", region: "Hisui" },
        10107: { name: "Hisuian Arcanine", category: "Regional Form", region: "Hisui" },
        10108: { name: "Hisuian Zoroark", category: "Regional Form", region: "Hisui" }
    };
    
    const typeColors = {
        normal: "#A8A77A", fire: "#EE8130", water: "#6390F0",
        electric: "#F7D02C", grass: "#7AC74C", ice: "#96D9D6",
        fighting: "#C22E28", poison: "#A33EA1", ground: "#E2BF65",
        flying: "#A98FF3", psychic: "#F95587", bug: "#A6B91A",
        rock: "#B6A136", ghost: "#735797", dragon: "#6F35FC",
        dark: "#705746", steel: "#B7B7CE", fairy: "#D685AD"
    };
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
    }
    document.getElementById('languageSelect').value = localStorage.getItem('language') || 'en';
    
    function navigatePrev() {
        let specialIds = Object.keys(specialCategories).map(Number).sort((a,b) => a - b);
        let currentIndex = specialIds.indexOf(currentPokemonId);
        let newId;
        if (currentIndex > 0) {
            newId = specialIds[currentIndex - 1];
        } else {
            newId = specialIds[specialIds.length - 1];
        }
        window.location.href = `special_detail.html?id=${newId}`;
    }
    
    function navigateNext() {
        let specialIds = Object.keys(specialCategories).map(Number).sort((a,b) => a - b);
        let currentIndex = specialIds.indexOf(currentPokemonId);
        let newId;
        if (currentIndex < specialIds.length - 1) {
            newId = specialIds[currentIndex + 1];
        } else {
            newId = specialIds[0];
        }
        window.location.href = `special_detail.html?id=${newId}`;
    }
    
    async function playCry() {
        if (!pokemonData) return;
        try {
            const cryUrl = pokemonData.cries?.latest || pokemonData.cries?.legacy;
            if (cryUrl) {
                const audio = new Audio(cryUrl);
                audio.volume = 0.3;
                await audio.play();
            }
        } catch(e) { console.log('Cry playback failed:', e); }
    }
    
    async function loadPokemonDetail() {
        const container = document.getElementById('mainContainer');
        container.innerHTML = '<div class="loader-small" style="margin: 60px auto;"></div><p style="text-align: center;">Loading special form data...</p>';
        
        // Get special info
        const specialInfo = specialCategories[currentPokemonId];
        if (!specialInfo) {
            container.innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2>❌ Special form not found!</h2>
                    <p>The special form with ID ${currentPokemonId} does not exist.</p>
                    <a href="specials_list.html" class="back-button">← Back to Special Forms</a>
                </div>
            `;
            return;
        }
        
        try {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${currentPokemonId}`);
            if (!response.ok) throw new Error('Pokémon not found');
            pokemonData = await response.json();
            
            const pokemonName = specialInfo.name;
            const category = specialInfo.category;
            const region = specialInfo.region;
            
            // Load Pokédex entry
            let dexEntry = "A special form Pokémon with unique characteristics!";
            try {
                const speciesRes = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${pokemonData.id}`);
                if (speciesRes.ok) {
                    const species = await speciesRes.json();
                    for (let entry of species.flavor_text_entries) {
                        if (entry.language.name === "en") {
                            dexEntry = entry.flavor_text.replace(/\n/g, ' ').replace(/\f/g, ' ');
                            break;
                        }
                    }
                }
            } catch(e) {}
            
            const stats = {
                hp: pokemonData.stats[0]?.base_stat || 0,
                attack: pokemonData.stats[1]?.base_stat || 0,
                defense: pokemonData.stats[2]?.base_stat || 0,
                spAttack: pokemonData.stats[3]?.base_stat || 0,
                spDefense: pokemonData.stats[4]?.base_stat || 0,
                speed: pokemonData.stats[5]?.base_stat || 0
            };
            const totalStats = stats.hp + stats.attack + stats.defense + stats.spAttack + stats.spDefense + stats.speed;
            
            container.innerHTML = `
                <div class="pokemon-header">
                    <h1>${pokemonName} <span class="category-badge">${category}</span></h1>
                    <div class="pokemon-id">Special ID: #${String(currentPokemonId).padStart(5, '0')}</div>
                    <div class="special-detail-badge">📍 Region: ${region}</div>
                </div>
                
                <div class="pokemon-image-container">
                    <img class="pokemon-image" src="${pokemonData.sprites.other['official-artwork']?.front_default || pokemonData.sprites.front_default}" 
                         alt="${pokemonName}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${currentPokemonId}.png'">
                </div>
                
                <div class="action-buttons">
                    <button class="cry-button" onclick="playCry()">🔊 Play Cry</button>
                    <button class="print-btn" onclick="window.print()">🖨️ Print / PDF</button>
                </div>
                
                <div class="info-grid">
                    <div class="info-card"><div class="info-label">📏 Height</div><div class="info-value">${pokemonData.height / 10} m</div></div>
                    <div class="info-card"><div class="info-label">⚖️ Weight</div><div class="info-value">${pokemonData.weight / 10} kg</div></div>
                    <div class="info-card"><div class="info-label">🎮 Base Exp</div><div class="info-value">${pokemonData.base_experience || 'N/A'}</div></div>
                    <div class="info-card"><div class="info-label">🗺️ Region</div><div class="info-value">${region}</div></div>
                </div>
                
                <div class="types-section">
                    <div class="section-title">🌈 Types</div>
                    <ul class="type-badge-list">
                        ${pokemonData.types.map(t => `<li class="type-badge" style="background: ${typeColors[t.type.name]}">${t.type.name.toUpperCase()}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="abilities-section">
                    <div class="section-title">✨ Abilities</div>
                    <ul class="ability-list">
                        ${pokemonData.abilities.map(a => `<li class="ability-item">${a.ability.name.replace("-", " ").toUpperCase()}${a.is_hidden ? ' (Hidden)' : ''}</li>`).join('')}
                    </ul>
                </div>
                
                <div class="stats-container">
                    <div class="section-title">📊 Base Stats</div>
                    <div class="stat-row"><span class="stat-name">❤️ HP</span> ${stats.hp}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(stats.hp/255)*100}%">${stats.hp}</div></div></div>
                    <div class="stat-row"><span class="stat-name">⚔️ Attack</span> ${stats.attack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(stats.attack/255)*100}%">${stats.attack}</div></div></div>
                    <div class="stat-row"><span class="stat-name">🛡️ Defense</span> ${stats.defense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(stats.defense/255)*100}%">${stats.defense}</div></div></div>
                    <div class="stat-row"><span class="stat-name">🔮 Sp. Attack</span> ${stats.spAttack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(stats.spAttack/255)*100}%">${stats.spAttack}</div></div></div>
                    <div class="stat-row"><span class="stat-name">✨ Sp. Defense</span> ${stats.spDefense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(stats.spDefense/255)*100}%">${stats.spDefense}</div></div></div>
                    <div class="stat-row"><span class="stat-name">⚡ Speed</span> ${stats.speed}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(stats.speed/255)*100}%">${stats.speed}</div></div></div>
                    <div class="stat-row" style="margin-top: 15px; border-top: 2px solid #ffcb05; padding-top: 12px;"><span class="stat-name">⭐ Total</span> <strong>${totalStats}</strong></div>
                </div>
                
                <div class="dex-entry">
                    <strong>📖 Pokédex Entry</strong><br>
                    "${dexEntry}"
                </div>
                
                <div style="text-align: center;">
                    <a href="specials_list.html" class="back-button">← Back to Special Forms</a>
                    <a href="start.html" class="back-button" style="margin-left: 15px;">🏠 Home</a>
                </div>
            `;
            
        } catch(error) {
            console.error('Error loading special form:', error);
            container.innerHTML = `
                <div style="text-align: center; padding: 50px;">
                    <h2>❌ Special form not available!</h2>
                    <p>${specialInfo.name} (#${currentPokemonId})</p>
                    <p>Category: ${specialInfo.category} | Region: ${specialInfo.region}</p>
                    <a href="specials_list.html" class="back-button">← Back to Special Forms</a>
                </div>
            `;
        }
    }
    
    loadPokemonDetail();
</script>
</body>
</html>
