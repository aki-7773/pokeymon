<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Special Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
        }
        
        .cry-button {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            background: #2a75bb;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .cry-button:hover {
            background: #ffcb05;
            color: #2a75bb;
        }
        
        .type-badge-mega {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-gmax {
            display: inline-block;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-primal {
            display: inline-block;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-regional {
            display: inline-block;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;
            border-radius: 24px;
        }
        
        .info-card {
            background: white;
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        
        body.dark-mode .info-card {
            background: rgba(30,30,40,0.9);
        }
        
        .info-label {
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 6px;
        }
        
        body.dark-mode .info-label {
            color: #ffcb05;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 600;
        }
        
        .types-section, .abilities-section {
            margin: 20px 0;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 12px;
            border-left: 4px solid #ffcb05;
            padding-left: 15px;
        }
        
        body.dark-mode .section-title {
            color: #ffcb05;
        }
        
        .type-badge-list, .ability-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            padding: 0;
        }
        
        .type-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .ability-item {
            background: #e8e8e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
        }
        
        body.dark-mode .ability-item {
            background: #3a3a4a;
            color: #eee;
        }
        
        .stats-container {
            margin: 25px 0;
        }
        
        .stat-row {
            margin: 14px 0;
        }
        
        .stat-name {
            font-weight: bold;
            display: inline-block;
            width: 100px;
        }
        
        .stat-bar-bg {
            background: #e0e0e0;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        body.dark-mode .stat-bar-bg {
            background: #3a3a4a;
        }
        
        .stat-bar-fill {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 12px;
            font-weight: bold;
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        
        .dex-entry {
            background: #f5f0e8;
            padding: 20px;
            border-radius: 24px;
            margin: 25px 0;
            font-style: italic;
            line-height: 1.6;
            border-left: 5px solid #ffcb05;
        }
        
        body.dark-mode .dex-entry {
            background: #2a2a3a;
            color: #ddd;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ffcb05;
            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
        }
        
        .loader-small {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            body { padding: 15px; }
            .container { padding: 20px; }
            .pokemon-image { width: 200px; height: 200px; }
            .info-grid { grid-template-columns: 1fr; }
            .profile-btn, .control-buttons { top: 10px; }
            .profile-btn { left: 10px; padding: 6px 12px; font-size: 12px; }
            .dark-mode-toggle, .language-select { padding: 6px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>
<a href="profile.html" class="profile-btn">👤 Profile</a>

        } else if (formType === 'alolan' || formType === 'galarian' || formType === 'hisuian' || formKey.includes('alolan') || formKey.includes('galarian') || formKey.includes('hisuian')) {
            badgeClass = 'type-badge-regional';
            badgeText = '🌍 REGIONAL FORM';
        } else if (formType === 'megaX' || formType === 'megaY' || formType === 'mega' || formKey.includes('mega')) {
            badgeClass = 'type-badge-mega';
            badgeText = '⚡ MEGA EVOLUTION';
        }
        
        const imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${basePokemonId}.png`;
        
        container.innerHTML = `
            <div class="pokemon-header">
                <h1>${formData.name} <span class="${badgeClass}">${badgeText}</span></h1>
            </div>
            
            <div class="pokemon-image-container">
                <img class="pokemon-image" src="${imageUrl}" 
                     alt="${formData.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${basePokemonId}.png'">
            </div>
            
            <button class="cry-button" onclick="playCry()">🔊 Play Cry</button>
            
            <div class="info-grid">
                <div class="info-card"><div class="info-label">✨ Ability</div><div class="info-value">${formData.ability}</div></div>
                <div class="info-card"><div class="info-label">📊 Total Stats</div><div class="info-value">${totalStats}</div></div>
            </div>
            
            <div class="types-section">
                <div class="section-title">🌈 Types</div>
                <ul class="type-badge-list">
                    ${formData.types.map(t => `<li class="type-badge" style="background: ${typeColors[t]}">${t.toUpperCase()}</li>`).join('')}
                </ul>
            </div>
            
            <div class="abilities-section">
                <div class="section-title">✨ Special Ability</div>
                <ul class="ability-list">
                    <li class="ability-item">${formData.ability}</li>
                </ul>
            </div>
            
            <div class="stats-container">
                <div class="section-title">📊 Base Stats (Special Form)</div>
                <div class="stat-row"><span class="stat-name">❤️ HP</span> ${formData.hp}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.hp/255)*100}%">${formData.hp}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚔️ Attack</span> ${formData.attack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.attack/255)*100}%">${formData.attack}</div></div></div>
                <div class="stat-row"><span class="stat-name">🛡️ Defense</span> ${formData.defense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.defense/255)*100}%">${formData.defense}</div></div></div>
                <div class="stat-row"><span class="stat-name">🔮 Sp. Attack</span> ${formData.spAttack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spAttack/255)*100}%">${formData.spAttack}</div></div></div>
                <div class="stat-row"><span class="stat-name">✨ Sp. Defense</span> ${formData.spDefense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spDefense/255)*100}%">${formData.spDefense}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚡ Speed</span> ${formData.speed}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.speed/255)*100}%">${formData.speed}</div></div></div>
            </div>
            
            <div class="dex-entry">
                <strong>📖 Special Form Pokédex Entry</strong><br>
                "${formData.dex}"
            </div>
            
            <div style="text-align: center;">
                <a href="pokemon_detail.html?id=${basePokemonId}" class="back-button">← Back to Pokémon</a>
                <a href="pokemon_list.html" class="back-button" style="margin-left: 15px;">📋 Pokédex</a>
            </div>
        `;
    }
    
    loadSpecialForm();
</script>
</body>
</html>
