<html>

    <title>Special Form</title>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;

            padding: 20px;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
        }
        
        .cry-button {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            background: #2a75bb;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .cry-button:hover {
            background: #ffcb05;
            color: #2a75bb;
        }
        
        .type-badge-mega {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-gmax {
            display: inline-block;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-primal {
            display: inline-block;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

            display: inline-block;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;
            border-radius: 24px;

            padding: 14px;
            border-radius: 20px;

        }

            color: #2a75bb;

            color: #ffcb05;
        }

            font-weight: 600;
        }

            color: #2a75bb;
            margin-bottom: 12px;
            border-left: 4px solid #ffcb05;

            color: #ffcb05;
        }

            gap: 12px;
            list-style: none;
            padding: 0;

            color: white;
            font-weight: bold;
            font-size: 14px;

            font-weight: 500;

            color: #eee;
        }

            display: inline-block;
            width: 100px;

            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            margin-top: 5px;
        }

            background: #3a3a4a;

            background: linear-gradient(90deg, #ff9800, #f57c00);
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 12px;
            font-weight: bold;
            border-radius: 20px;

            padding: 20px;
            border-radius: 24px;
            margin: 25px 0;
            font-style: italic;
            line-height: 1.6;
            border-left: 5px solid #ffcb05;

            color: #ddd;
        }

            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;

            width: 40px;
            height: 40px;

            margin: 20px auto;
        }

            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

            .container { padding: 20px; }
            .pokemon-image { width: 200px; height: 200px; }
            .info-grid { grid-template-columns: 1fr; }
            .profile-btn, .control-buttons { top: 10px; }
            .profile-btn { left: 10px; padding: 6px 12px; font-size: 12px; }

        "571-hisuian": { types: ["normal", "ghost"], ability: "Illusion", hp: 55, attack: 100, defense: 60, spAttack: 125, spDefense: 60, speed: 110, dex: "Hisuian Zoroark's illusions are said to be powerful enough to create tangible copies that can attack.", spriteId: 10108 },
        // Gigantamax Snorlax
        "143-gmax": { types: ["normal"], ability: "Gluttony", hp: 160, attack: 110, defense: 65, spAttack: 65, spDefense: 110, speed: 30, dex: "Gigantamax Snorlax's belly grows to enormous size. It can store enough energy to last for years.", spriteId: 10209 },
        // Gigantamax Lapras
        "131-gmax": { types: ["water", "ice"], ability: "Water Absorb", hp: 130, attack: 85, defense: 80, spAttack: 85, spDefense: 95, speed: 60, dex: "Gigantamax Lapras's shell becomes even larger. Its melodic voice can calm even the fiercest storms.", spriteId: 10203 },
        // Gigantamax Kingler
        "99-gmax": { types: ["water"], ability: "Hyper Cutter", hp: 55, attack: 130, defense: 115, spAttack: 50, spDefense: 50, speed: 75, dex: "Gigantamax Kingler's pincers grow to massive size. One pinch can crush anything.", spriteId: 10198 },
        // Gigantamax Machamp
        "68-gmax": { types: ["fighting"], ability: "Guts", hp: 90, attack: 130, defense: 80, spAttack: 65, spDefense: 85, speed: 55, dex: "Gigantamax Machamp's four arms become incredibly muscular. It can punch mountains into rubble.", spriteId: 10201 },
        // Gigantamax Meowth
        "52-gmax": { types: ["normal"], ability: "Pickup", hp: 40, attack: 35, defense: 35, spAttack: 50, spDefense: 40, speed: 90, dex: "Gigantamax Meowth grows incredibly long. The coin on its forehead shines with golden light.", spriteId: 10200 },
        // Gigantamax Gengar
        "94-gmax": { types: ["ghost", "poison"], ability: "Cursed Body", hp: 60, attack: 65, defense: 80, spAttack: 170, spDefense: 95, speed: 130, dex: "Gigantamax Gengar's mouth stretches to the underworld, dragging anything nearby into the darkness.", spriteId: 10202 },

        "812-gmax": { types: ["grass"], ability: "Overgrow", hp: 100, attack: 125, defense: 90, spAttack: 60, spDefense: 70, speed: 85, dex: "Gigantamax Rillaboom's drum grows enormous. Its drumming can cause earthquakes.", spriteId: 10218 },
        // Gigantamax Cinderace
        "815-gmax": { types: ["fire"], ability: "Blaze", hp: 80, attack: 116, defense: 75, spAttack: 65, spDefense: 75, speed: 119, dex: "Gigantamax Cinderace's fireball grows to enormous size. It can scorch entire fields.", spriteId: 10219 },
        // Gigantamax Inteleon
        "818-gmax": { types: ["water"], ability: "Torrent", hp: 70, attack: 85, defense: 65, spAttack: 125, spDefense: 65, speed: 120, dex: "Gigantamax Inteleon's water gun becomes a massive cannon. It can hit targets from miles away.", spriteId: 10220 },
        // Gigantamax Corviknight
        "823-gmax": { types: ["flying", "steel"], ability: "Pressure", hp: 98, attack: 87, defense: 105, spAttack: 53, spDefense: 85, speed: 67, dex: "Gigantamax Corviknight's wings become massive. It can carry entire buildings.", spriteId: 10221 },
        // Gigantamax Melmetal
        "809-gmax": { types: ["steel"], ability: "Iron Fist", hp: 135, attack: 143, defense: 143, spAttack: 80, spDefense: 65, speed: 34, dex: "Gigantamax Melmetal's body becomes liquid metal. It can form unlimited shapes.", spriteId: 10213 }
    };
    
    // Bestimme den korrekten FormKey
    let formKeyLookup = `${basePokemonId}-${formKey}`;
    let formData = specialFormData[formKeyLookup];
    
    // Fallback mit specialId
    if (!formData && specialId) {
        formData = specialFormData[`${basePokemonId}-${formKey}`];
    }
    
    // Letzter Fallback - generische Daten
    if (!formData) {
        formData = {
            types: ["normal"],
            ability: "Unknown",
            hp: 100, attack: 100, defense: 100, spAttack: 100, spDefense: 100, speed: 100,
            dex: `This is a special form of Pokémon #${basePokemonId}. These special forms have unique abilities and appearances!`,
            spriteId: basePokemonId
        };
    }
    
    const cryUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${basePokemonId}.ogg`;
    const spriteId = formData.spriteId || basePokemonId;
    const imageUrl = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${spriteId}.png`;
    
    function playCry() {
        const audio = new Audio(cryUrl);
        audio.volume = 0.3;
        audio.play().catch(e => console.log('Cry playback failed'));
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
    }
    document.getElementById('languageSelect').value = localStorage.getItem('language') || 'en';
    
    function loadSpecialForm() {
        const container = document.getElementById('mainContainer');
        
        const totalStats = formData.hp + formData.attack + formData.defense + formData.spAttack + formData.spDefense + formData.speed;
        
        let badgeClass = 'type-badge-mega';
        let badgeText = '⚡ MEGA EVOLUTION';
        if (formKey === 'gmax') { badgeClass = 'type-badge-gmax'; badgeText = '💥 GIGANTAMAX'; }
        else if (formKey === 'primal') { badgeClass = 'type-badge-primal'; badgeText = '🌊 PRIMAL REVERSION'; }
        else if (formKey === 'alolan' || formKey === 'galarian' || formKey === 'hisuian') { badgeClass = 'type-badge-regional'; badgeText = '🌍 REGIONAL FORM'; }
        
        container.innerHTML = `
            <div class="pokemon-header">
                <h1>${formName} <span class="${badgeClass}">${badgeText}</span></h1>
            </div>
            
            <div class="pokemon-image-container">
                <img class="pokemon-image" src="${imageUrl}" 
                     alt="${formName}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${spriteId}.png'">
            </div>
            
            <button class="cry-button" onclick="playCry()">🔊 Play Cry</button>
            
            <div class="info-grid">
                <div class="info-card"><div class="info-label">✨ Ability</div><div class="info-value">${formData.ability}</div></div>
                <div class="info-card"><div class="info-label">📊 Total Stats</div><div class="info-value">${totalStats}</div></div>
            </div>
            
            <div class="types-section">
                <div class="section-title">🌈 Types</div>
                <ul class="type-badge-list">
                    ${formData.types.map(t => `<li class="type-badge" style="background: ${typeColors[t]}">${t.toUpperCase()}</li>`).join('')}
                </ul>
            </div>
            
            <div class="abilities-section">
                <div class="section-title">✨ Special Ability</div>
                <ul class="ability-list">
                    <li class="ability-item">${formData.ability}</li>
                </ul>
            </div>
            
            <div class="stats-container">
                <div class="section-title">📊 Base Stats (Special Form)</div>
                <div class="stat-row"><span class="stat-name">❤️ HP</span> ${formData.hp}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.hp/255)*100}%">${formData.hp}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚔️ Attack</span> ${formData.attack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.attack/255)*100}%">${formData.attack}</div></div></div>
                <div class="stat-row"><span class="stat-name">🛡️ Defense</span> ${formData.defense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.defense/255)*100}%">${formData.defense}</div></div></div>
                <div class="stat-row"><span class="stat-name">🔮 Sp. Attack</span> ${formData.spAttack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spAttack/255)*100}%">${formData.spAttack}</div></div></div>
                <div class="stat-row"><span class="stat-name">✨ Sp. Defense</span> ${formData.spDefense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spDefense/255)*100}%">${formData.spDefense}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚡ Speed</span> ${formData.speed}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.speed/255)*100}%">${formData.speed}</div></div></div>
            </div>
            
            <div class="dex-entry">
                <strong>📖 Special Form Pokédex Entry</strong><br>
                "${formData.dex}"
            </div>
            
            <div style="text-align: center;">
                <a href="javascript:history.back()" class="back-button">← Back to Pokémon</a>
                <a href="pokemon_list.html" class="back-button" style="margin-left: 15px;">📋 Pokédex</a>
            </div>
        `;
    }
    
    loadSpecialForm();
</script>
</body>
</html>
