<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Special Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
        }
        
        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }
        
        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }
        
        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }
        
        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
        }
        
        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }
        
        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }
        
        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
            background: transparent;
        }
        
        .cry-button {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            background: #2a75bb;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .cry-button:hover {
            background: #ffcb05;
            color: #2a75bb;
        }
        
        .type-badge-mega {
            display: inline-block;
            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-gmax {
            display: inline-block;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-primal {
            display: inline-block;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .type-badge-regional {
            display: inline-block;
            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin: 25px 0;
            background: rgba(0,0,0,0.04);
            padding: 18px;
            border-radius: 24px;
        }
        
        .info-card {
            background: white;
            padding: 14px;
            border-radius: 20px;
            text-align: center;
        }
        
        body.dark-mode .info-card {
            background: rgba(30,30,40,0.9);
        }
        
        .info-label {
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 6px;
        }
        
        body.dark-mode .info-label {
            color: #ffcb05;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 600;
        }
        
        .types-section, .abilities-section {
            margin: 20px 0;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            color: #2a75bb;
            margin-bottom: 12px;
            border-left: 4px solid #ffcb05;
            padding-left: 15px;
        }
        
        body.dark-mode .section-title {
            color: #ffcb05;
        }
        
        .type-badge-list, .ability-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            list-style: none;
            padding: 0;
        }
        
        .type-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }
        
        .ability-item {
            background: #e8e8e8;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
        }
        
        body.dark-mode .ability-item {
            background: #3a3a4a;
            color: #eee;
        }
        
        .stats-container {
            margin: 25px 0;
        }
        
        .stat-row {
            margin: 14px 0;
        }
        
        .stat-name {
            font-weight: bold;
            display: inline-block;
            width: 100px;
        }
        
        .stat-bar-bg {
            background: #e0e0e0;
            border-radius: 20px;
            height: 28px;
            overflow: hidden;
            margin-top: 5px;
        }
        
        body.dark-mode .stat-bar-bg {
            background: #3a3a4a;
        }
        
        .stat-bar-fill {
            background: linear-gradient(90deg, #ff9800, #f57c00);
            height: 100%;
            color: white;
            line-height: 28px;
            padding-left: 12px;
            font-weight: bold;
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        
        .dex-entry {
            background: #f5f0e8;
            padding: 20px;
            border-radius: 24px;
            margin: 25px 0;
            font-style: italic;
            line-height: 1.6;
            border-left: 5px solid #ffcb05;
        }
        
        body.dark-mode .dex-entry {
            background: #2a2a3a;
            color: #ddd;
        }
        
        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 30px;
            background: #ffcb05;
            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;
        }
        
        .loader-small {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            body { padding: 15px; }
            .container { padding: 20px; }
            .pokemon-image { width: 200px; height: 200px; }
            .info-grid { grid-template-columns: 1fr; }
            .profile-btn, .control-buttons { top: 10px; }
            .profile-btn { left: 10px; padding: 6px 12px; font-size: 12px; }
            .dark-mode-toggle, .language-select { padding: 6px 12px; font-size: 11px; }

</head>

        "78-galarian": { types: ["psychic","fairy"], ability: "Pastel Veil", hp:65, attack:100, defense:70, spAttack:80, spDefense:80, speed:105, dex: "Galarian Rapidash reads emotions.", imageFile: "078-Galarian.png", apiFormName: "galarian" },
        
        // Hisuian Growlithe
        "58-hisuian": { types: ["fire","rock"], ability: "Intimidate", hp:60, attack:75, defense:45, spAttack:65, spDefense:50, speed:55, dex: "Hisuian Growlithe has a rocky horn.", imageFile: "058-Hisuian.png", apiFormName: "hisuian" },
        
        // Hisuian Arcanine
        "59-hisuian": { types: ["fire","rock"], ability: "Intimidate", hp:90, attack:115, defense:80, spAttack:95, spDefense:80, speed:90, dex: "Hisuian Arcanine's rocky fur protects.", imageFile: "059-Hisuian.png", apiFormName: "hisuian" },
        
        // Hisuian Zoroark
        "571-hisuian": { types: ["normal","ghost"], ability: "Illusion", hp:55, attack:100, defense:60, spAttack:125, spDefense:60, speed:110, dex: "Hisuian Zoroark's illusions are powerful.", imageFile: "571-Hisui.png", apiFormName: "hisuian" }
    };
    
    // Finde die Daten für die aktuelle Form
    let lookupKey = `${basePokemonId}-${formKey}`;
    let formData = specialFormData[lookupKey];
    
    // Fallback für nicht gefundene Formen
    if (!formData) {
        formData = {
            types: ["normal"], ability: "Unknown", hp: 100, attack: 100, defense: 100,
            spAttack: 100, spDefense: 100, speed: 100,
            dex: `${formName} is a special form of Pokémon #${basePokemonId}.`,
            imageFile: null, apiFormName: null
        };
    }
    
    // ========== ROBUSTE BILD-LOGIK mit PokeAPI Form-Endpunkt ==========
    let imageUrl;
    let fallbackImageUrl = POKEAPI_ARTWORK_URL + basePokemonId + '.png';
    
    // 1. Versuche spezifisches HybridShivam-Bild (für Mega, Gmax, Regionale)
    if (formData.imageFile) {
        imageUrl = HYBRID_IMAGE_BASE_URL + formData.imageFile;
    }
    // 2. Für regionale Formen ohne spezifische Datei: Namensschema
    else if (formKey === 'alolan' || formKey === 'galarian' || formKey === 'hisuian') {
        const paddedId = String(basePokemonId).padStart(3, '0');
        const region = formKey.charAt(0).toUpperCase() + formKey.slice(1);
        imageUrl = HYBRID_IMAGE_BASE_URL + paddedId + '-' + region + '.png';
    }
    // 3. Für Mega Evolutions
    else if (formKey === 'mega' || formKey === 'megaX' || formKey === 'megaY') {
        const paddedId = String(basePokemonId).padStart(3, '0');
        let suffix = '';
        if (formKey === 'megaX') suffix = '-Mega-X';
        else if (formKey === 'megaY') suffix = '-Mega-Y';
        else suffix = '-Mega';
        imageUrl = HYBRID_IMAGE_BASE_URL + paddedId + suffix + '.png';
    }
    else {
        imageUrl = fallbackImageUrl;
    }
    
    const cryUrl = `https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/${basePokemonId}.ogg`;
    
    function playCry() {
        const audio = new Audio(cryUrl);
        audio.volume = 0.3;
        audio.play().catch(e => console.log('Playback failed'));
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    if (localStorage.getItem('darkMode') === 'true') {
        document.body.classList.add('dark-mode');
        document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
    }
    document.getElementById('languageSelect').value = localStorage.getItem('language') || 'en';
    
    function loadSpecialForm() {
        const container = document.getElementById('mainContainer');
        const totalStats = formData.hp + formData.attack + formData.defense + 
                          formData.spAttack + formData.spDefense + formData.speed;
        
        let badgeClass = 'type-badge-mega';
        let badgeText = '⚡ MEGA EVOLUTION';
        if (formKey === 'gmax') { badgeClass = 'type-badge-gmax'; badgeText = '💥 GIGANTAMAX'; }
        else if (formKey === 'primal') { badgeClass = 'type-badge-primal'; badgeText = '🌊 PRIMAL REVERSION'; }
        else if (formKey === 'alolan' || formKey === 'galarian' || formKey === 'hisuian') 
            { badgeClass = 'type-badge-regional'; badgeText = '🌍 REGIONAL FORM'; }
        
        container.innerHTML = `
            <div class="pokemon-header">
                <h1>${formName} <span class="${badgeClass}">${badgeText}</span></h1>
            </div>
            <div class="pokemon-image-container">
                <img class="pokemon-image" src="${imageUrl}" alt="${formName}" 
                     onerror="this.onerror=null; this.src='${fallbackImageUrl}'; this.alt='${formName} (Standard Artwork)'">
            </div>
            <button class="cry-button" onclick="playCry()">🔊 Play Cry</button>
            <div class="info-grid">
                <div class="info-card"><div class="info-label">✨ Ability</div><div class="info-value">${formData.ability}</div></div>
                <div class="info-card"><div class="info-label">📊 Total Stats</div><div class="info-value">${totalStats}</div></div>
            </div>
            <div class="types-section">
                <div class="section-title">🌈 Types</div>
                <ul class="type-badge-list">
                    ${formData.types.map(t => `<li class="type-badge" style="background: ${typeColors[t]}">${t.toUpperCase()}</li>`).join('')}
                </ul>
            </div>
            <div class="abilities-section">
                <div class="section-title">✨ Special Ability</div>
                <ul class="ability-list"><li class="ability-item">${formData.ability}</li></ul>
            </div>
            <div class="stats-container">
                <div class="section-title">📊 Base Stats (Special Form)</div>
                <div class="stat-row"><span class="stat-name">❤️ HP</span> ${formData.hp}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.hp/255)*100}%">${formData.hp}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚔️ Attack</span> ${formData.attack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.attack/255)*100}%">${formData.attack}</div></div></div>
                <div class="stat-row"><span class="stat-name">🛡️ Defense</span> ${formData.defense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.defense/255)*100}%">${formData.defense}</div></div></div>
                <div class="stat-row"><span class="stat-name">🔮 Sp. Attack</span> ${formData.spAttack}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spAttack/255)*100}%">${formData.spAttack}</div></div></div>
                <div class="stat-row"><span class="stat-name">✨ Sp. Defense</span> ${formData.spDefense}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.spDefense/255)*100}%">${formData.spDefense}</div></div></div>
                <div class="stat-row"><span class="stat-name">⚡ Speed</span> ${formData.speed}<div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${(formData.speed/255)*100}%">${formData.speed}</div></div></div>
            </div>
            <div class="dex-entry"><strong>📖 Special Form Pokédex Entry</strong><br>"${formData.dex}"</div>
            <div style="text-align: center;">
                <a href="javascript:history.back()" class="back-button">← Back to Pokémon</a>
                <a href="pokemon_list.html" class="back-button" style="margin-left: 15px;">📋 Pokédex</a>
            </div>
        `;
    }
    
    loadSpecialForm();
</script>
</body>
</html>
