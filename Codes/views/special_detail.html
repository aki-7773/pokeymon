<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Special Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            transition: all 0.3s ease;
            padding: 20px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.97);
            border-radius: 32px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        body.dark-mode .container {
            background: rgba(0,0,0,0.88);
            color: #e0e0e0;
        }

        .control-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .dark-mode-toggle, .language-select {
            background: rgba(42,117,187,0.9);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }

        .profile-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(42,117,187,0.9);
            color: white;
            padding: 10px 18px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }

        .back-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: bold;
            z-index: 100;
        }

        .pokemon-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .pokemon-header h1 {
            color: #2a75bb;
            font-size: 38px;
        }

        body.dark-mode .pokemon-header h1 {
            color: #ffcb05;
        }

        .pokemon-image-container {
            text-align: center;
            margin: 15px 0;
        }

        .pokemon-image {
            width: 260px;
            height: 260px;
            object-fit: contain;
            filter: drop-shadow(8px 12px 20px rgba(0,0,0,0.2));
            background: transparent;
        }

        .cry-button {
            display: block;
            margin: 10px auto;
            padding: 8px 20px;
            background: #2a75bb;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }

        .cry-button:hover {
            background: #ffcb05;
            color: #2a75bb;
        }

            background: linear-gradient(135deg, #9c27b0, #7b1fa2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

        .type-badge-primal {
            display: inline-block;
            background: linear-gradient(135deg, #00bcd4, #0097a7);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;
        }

        .type-badge-regional {

            background: linear-gradient(135deg, #2196f3, #1976d2);
            color: white;
            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;

            padding: 5px 15px;
            border-radius: 25px;
            font-size: 14px;
            margin-left: 10px;

            padding: 5px 15px;

            height: 28px;

            margin-top: 5px;

            background: #3a3a4a;

            line-height: 28px;

            padding: 12px 30px;
            background: #ffcb05;
            color: #2a75bb;
            text-decoration: none;
            border-radius: 40px;
            font-weight: bold;
            text-align: center;

            border-top: 3px solid #ffcb05;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        @media (max-width: 768px) {

</head>

    // ========== NEUE FUNKTION: Holt offizielles Artwork von PokeAPI ==========
    async function getOfficialFormArtwork(apiFormName) {
        if (!apiFormName) return null;
        try {
            const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${apiFormName}`);
            if (!response.ok) return null;
            const data = await response.json();
            return data.sprites?.other?.["official-artwork"]?.front_default || data.sprites?.front_default || null;
        } catch (error) {
            console.log(`Could not fetch artwork for ${apiFormName}:`, error);
            return null;
        }
    }

            if (gmaxEkishoFiles[baseId]) {
                return `${PROJECT_EKISHO_URL}${gmaxEkishoFiles[baseId]}.png`;
            }
        }
        
        // Für Mega Evolutions - zuerst versuchen von Project-EKISHO

            const paddedId = String(baseId).padStart(3, '0');
            if (baseId === 6 && formKey === 'megaX') {
                return `${PROJECT_EKISHO_URL}006-Mega-X.png`;
            }
            if (baseId === 6 && formKey === 'megaY') {
                return `${PROJECT_EKISHO_URL}006-Mega-Y.png`;
            }
            if (baseId === 150 && formKey === 'megaX') {
                return `${PROJECT_EKISHO_URL}150-Mega-X.png`;
            }
            if (baseId === 150 && formKey === 'megaY') {
                return `${PROJECT_EKISHO_URL}150-Mega-Y.png`;
            }
            return `${PROJECT_EKISHO_URL}${paddedId}-Mega.png`;
        }
        
        // Für Primal Forms
        if (formKey === 'primal') {
            if (baseId === 382) return `${PROJECT_EKISHO_URL}382-Primal.png`;
            if (baseId === 383) return `${PROJECT_EKISHO_URL}383-Primal.png`;
        }
        
        // Für Alolan Forms

            const paddedId = String(baseId).padStart(3, '0');
            return `${PROJECT_EKISHO_URL}${paddedId}-Alolan.png`;
        }
        
        // Für Galarian Forms

            return `${PROJECT_EKISHO_URL}${paddedId}-Galarian.png`;

    // ========== BILD-LOGIK ==========
    async function loadImageUrl() {
        // Priorität 1: Direkter Bild-URL-Versuch mit Project-EKISHO
        const directUrl = getImageUrlForForm(basePokemonId, formKey, formData);
        console.log("🖼️ Versuche Bild-URL:", directUrl);
        
        // Wenn wir eine direkte URL haben, versuchen wir die Existenz zu prüfen
        if (directUrl && !directUrl.includes(POKEAPI_ARTWORK_URL)) {
            try {
                // Teste ob das Bild existiert (mit fetch HEAD)
                const testResponse = await fetch(directUrl, { method: 'HEAD' });
                if (testResponse.ok) {
                    console.log("✅ Bild gefunden:", directUrl);
                    return directUrl;
                } else {
                    console.log("❌ Bild nicht gefunden (HTTP", testResponse.status, "):", directUrl);
                }
            } catch(e) {
                console.log("⚠️ Bild-Test fehlgeschlagen:", directUrl, e);
            }
        }
        
        // Priorität 2: Offizielles PokeAPI Artwork (wenn apiFormName existiert)
        if (formData.apiFormName && !formData.isGmax) {
            const officialArtwork = await getOfficialFormArtwork(formData.apiFormName);
            if (officialArtwork) {
                console.log("✅ Offizielles Artwork gefunden:", officialArtwork);
                return officialArtwork;
            }
        }
        
        // Priorität 3: HybridShivam Repository (Fallback für Gigantamax)
        if (formData.imageFile) {
            const hybridUrl = HYBRID_IMAGE_BASE_URL + formData.imageFile;
            console.log("🖼️ Versuche HybridShivam:", hybridUrl);
            // Wir testen nicht vorab, vertrauen auf onerror
            return hybridUrl;
        }
        
        // Priorität 4: Generischer Fallback für regionale Formen
        if (formKey === 'alolan' || formKey === 'galarian' || formKey === 'hisuian') {
            const paddedId = String(basePokemonId).padStart(3, '0');
            const region = formKey.charAt(0).toUpperCase() + formKey.slice(1);
            const genericUrl = HYBRID_IMAGE_BASE_URL + paddedId + '-' + region + '.png';
            console.log("🖼️ Generischer regionaler Fallback:", genericUrl);
            return genericUrl;
        }
        
        // Priorität 5: Standard Artwork
        console.log("🖼️ Fallback zu Standard-Artwork:", fallbackImageUrl);
        return fallbackImageUrl;
    }
