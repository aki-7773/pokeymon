<!DOCTYPE html>

        .control-buttons { display: flex; gap: 12px; align-items: center; }

        .nav-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-btn { display: inline-block; padding: 10px 18px; background: rgba(0,0,0,0.35); color: white; text-decoration: none; border-radius: 40px; font-weight: bold; transition: all 0.3s; font-size: 14px; border: 1px solid rgba(255,255,255,0.15); }

    // ========== HAUPTFUNKTION: ALLE POKÉMON LADEN ==========
    async function loadAllPokemon() {
        const gridContainer = document.getElementById('pokemonGrid');
        gridContainer.innerHTML = '<div class="loading"><div class="loader"></div><p>Loading Pokédex data...</p></div>';
        
        try {
            const response = await fetch('https://pokeapi.co/api/v2/pokemon?limit=2000');
            const data = await response.json();
            
            const tempPokemonList = [];
            
            // 1. Normale Pokémon (IDs 1-1025)
            for (const item of data.results) {
                const pokeId = parseInt(item.url.split('/').slice(-2)[0]);
                if (pokeId <= 1025) {
                    let generation = 1;
                    if (pokeId <= 151) generation = 1;
                    else if (pokeId <= 251) generation = 2;
                    else if (pokeId <= 386) generation = 3;
                    else if (pokeId <= 493) generation = 4;
                    else if (pokeId <= 649) generation = 5;
                    else if (pokeId <= 721) generation = 6;
                    else if (pokeId <= 809) generation = 7;
                    else if (pokeId <= 905) generation = 8;
                    else generation = 9;
                    
                    try {
                        const detailsResponse = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokeId}`);
                        const details = await detailsResponse.json();
                        tempPokemonList.push({
                            id: pokeId,
                            name: item.name.charAt(0).toUpperCase() + item.name.slice(1),
                            rawName: item.name,
                            generation: generation,
                            types: details.types.map(t => t.type.name),
                            isSpecial: false
                        });
                    } catch (err) {
                        tempPokemonList.push({
                            id: pokeId,
                            name: item.name.charAt(0).toUpperCase() + item.name.slice(1),
                            rawName: item.name,
                            generation: generation,
                            types: [],
                            isSpecial: false
                        });
                    }
                }
            }
            
            // 2. Spezielle Formen hinzufügen
            for (const special of specialFormsDatabase) {
                try {
                    const specialResponse = await fetch(`https://pokeapi.co/api/v2/pokemon/${special.id}`);
                    if (specialResponse.ok) {
                        const specialData = await specialResponse.json();
                        tempPokemonList.push({
                            id: special.id,
                            name: special.name,
                            rawName: special.name.toLowerCase().replace(/\s/g, '-'),
                            generation: special.gen,
                            types: specialData.types.map(t => t.type.name),
                            isSpecial: true,
                            searchTerms: special.searchTerms,
                            category: special.category,
                            baseId: special.baseId
                        });
                    } else {
                        tempPokemonList.push({
                            id: special.id,
                            name: special.name,
                            rawName: special.name.toLowerCase().replace(/\s/g, '-'),
                            generation: special.gen,
                            types: [],
                            isSpecial: true,
                            searchTerms: special.searchTerms,
                            category: special.category,
                            baseId: special.baseId
                        });
                    }
                } catch (err) {
                    tempPokemonList.push({
                        id: special.id,
                        name: special.name,
                        rawName: special.name.toLowerCase().replace(/\s/g, '-'),
                        generation: special.gen,
                        types: [],
                        isSpecial: true,
                        searchTerms: special.searchTerms,
                        category: special.category,
                        baseId: special.baseId
                    });
                }
            }
            
            tempPokemonList.sort((a, b) => a.id - b.id);
            allPokemon = tempPokemonList;
            
            updateStatistics();
            renderPokemonGrid();
            
        } catch (error) {
            console.error('Fatal error loading Pokémon:', error);
            gridContainer.innerHTML = '<div class="loading"><p>❌ Error loading Pokémon data. Please refresh the page.</p></div>';
        }
    }
    
    function updateStatistics() {
        const specialCount = allPokemon.filter(p => p.isSpecial).length;
        document.getElementById('statsInfo').innerHTML = `📊 Total: ${allPokemon.length} Pokémon (${specialCount} special forms) | ⭐ Favorites: ${favoritePokemon.length}/6`;
    }
    
    function renderPokemonGrid() {
        const gridContainer = document.getElementById('pokemonGrid');
        let filteredList = [...allPokemon];
        
        if (currentTypeFilter !== 'all') {
            filteredList = filteredList.filter(p => p.types && p.types.includes(currentTypeFilter));
        }
        
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        if (searchTerm.length >= 2) {
            filteredList = filteredList.filter(p => {
                if (p.name.toLowerCase().includes(searchTerm)) return true;
                if (p.rawName && p.rawName.toLowerCase().includes(searchTerm)) return true;
                if (p.searchTerms) return p.searchTerms.some(term => term.toLowerCase().includes(searchTerm));
                return false;
            });
        }
        
        if (filteredList.length === 0) {
            gridContainer.innerHTML = '<div class="loading"><p>⚠️ No Pokémon match your search or filter.</p></div>';
            return;
        }
        
        let categoryDisplay = "";
        gridContainer.innerHTML = filteredList.map(pokemon => {
            if (pokemon.isSpecial) {
                if (pokemon.category === "mega") categoryDisplay = '<div class="special-badge">⭐ Mega Evolution</div>';
                else if (pokemon.category === "primal") categoryDisplay = '<div class="special-badge">⭐ Primal Reversion</div>';
                else if (pokemon.category === "gmax") categoryDisplay = '<div class="special-badge">⭐ Gigantamax</div>';
                else if (pokemon.category === "regional") categoryDisplay = '<div class="special-badge">⭐ Regional Form</div>';
                else categoryDisplay = '<div class="special-badge">⭐ Special Form</div>';
            } else {
                categoryDisplay = `<div class="gen-badge">Gen ${pokemon.generation}</div>`;
            }
            
            return `
            <div class="pokemon-card" onclick="navigateToDetail(${pokemon.id})">
                <button class="favorite-btn ${favoritePokemon.includes(pokemon.id) ? 'favorited' : ''}" 
                        onclick="event.stopPropagation(); toggleFavoritePokemon(${pokemon.id})">
                    ${favoritePokemon.includes(pokemon.id) ? '★' : '☆'}
                </button>
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${pokemon.id}.png" 
                     alt="${pokemon.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png'">
                <h3>${pokemon.name}</h3>
                <div class="pokemon-number">#${String(pokemon.id).padStart(pokemon.isSpecial ? 5 : 3, '0')}</div>
                <div class="type-badges">
                    ${pokemon.types ? pokemon.types.map(t => `<span class="type-badge" style="background: ${typeColorMap[t]}">${t.toUpperCase()}</span>`).join('') : ''}
                </div>
                ${categoryDisplay}
            </div>
        `}).join('');
    }
    
    function applyTypeFilter(type) {
        currentTypeFilter = type;
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('data-type') === type) btn.classList.add('active');
        });
        renderPokemonGrid();
    }
    
    function toggleFavoritePokemon(pokemonId) {
        if (favoritePokemon.includes(pokemonId)) {
            favoritePokemon = favoritePokemon.filter(id => id !== pokemonId);
        } else if (favoritePokemon.length < 6) {
            favoritePokemon.push(pokemonId);
        } else {
            alert('You can only have 6 Pokémon in your team! Remove one first.');
            return;
        }
        localStorage.setItem('favorites', JSON.stringify(favoritePokemon));
        updateStatistics();
        renderPokemonGrid();
    }
    
    function navigateToDetail(pokemonId) {
        window.location.href = `pokemon_detail.html?id=${pokemonId}`;
    }
    
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        const btn = document.getElementById('darkModeBtn');
        btn.innerHTML = document.body.classList.contains('dark-mode') ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    
    function changeLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('language', lang);
        document.getElementById('languageSelect').value = lang;
    }
    
    function setupSearchSuggestions() {
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestions');
        
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            renderPokemonGrid();
            if (query.length < 2) { suggestionsBox.style.display = 'none'; return; }
            const matches = allPokemon.filter(p => {
                if (p.name.toLowerCase().includes(query)) return true;
                if (p.rawName && p.rawName.toLowerCase().includes(query)) return true;
                if (p.searchTerms) return p.searchTerms.some(term => term.toLowerCase().includes(query));
                return false;
            }).slice(0, 12);
            if (matches.length > 0) {
                suggestionsBox.style.display = 'block';
                suggestionsBox.innerHTML = matches.map(p => `<div onclick="navigateToDetail(${p.id})">${p.name} (#${String(p.id).padStart(p.isSpecial ? 5 : 3, '0')})${p.isSpecial ? ' ⭐' : ''}</div>`).join('');
            } else { suggestionsBox.style.display = 'none'; }
        });
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-suggestions')) suggestionsBox.style.display = 'none';
        });
    }
    
    function initialize() {
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark-mode');
            document.getElementById('darkModeBtn').innerHTML = '☀️ Light Mode';
        }
        document.getElementById('languageSelect').value = currentLanguage;
        setupSearchSuggestions();
        loadAllPokemon();
    }
    
    initialize();
</script>
</body>
</html>
